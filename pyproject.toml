[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicf-core"
version = "1.0.1"
description = "AICF - Agent Infrastructure Cybernetics Framework: a scenario-agnostic agent engine (turn loop, tools, sqlite sessions, sub-agent collaboration)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Jeffery Darkstar", email = "ccjjfdyqlhy@outlook.com" }]
keywords = ["agent", "llm", "tools", "sessions", "subagents", "framework", "agent-harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "openai>=1.0.0",
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

# ─────────────────────────────────────────────────────────────────────────
# optional extras
#
# core keeps only product-neutral mechanisms: model access, the tool protocol,
# context assembly, memory, events, session persistence, policy, auth and
# telemetry. Four product-oriented capabilities (personality, decision head,
# learning loop, local finetune) stay in core but sit behind extras, so a
# default install pulls no extra dependency.
#
#   pip install aicf-core                 # 内核 + 工具 + 上下文 + 会话
#   pip install aicf-core[personality]    # + 人格动态（PEV3，角色卡/蒸馏/判官）
#   pip install aicf-core[decisions]      # + System-1 决策头（零额外依赖）
#   pip install aicf-core[learning]       # + 轨迹→数据集→分层判官→晋级闭环
#   pip install aicf-core[finetune]       # + 本地 SFT（需要 torch）
#   pip install aicf-core[all]            # 全部
# ─────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]
# 人格动态：角色卡加载、蒸馏、判官、情绪向量。仅依赖 yaml（已在核心依赖里），
# 保留这个 extra 是为了让「装不装人格」在依赖层面可见。
personality = ["PyYAML>=6.0"]
# System-1 决策头：一次前向给出带概率的判断。纯标准库实现，无额外依赖。
decisions = []
# 学习闭环：从 agent 轨迹构建数据集、分层判官、候选晋级与回滚。纯标准库实现。
learning = []
# 本地 SFT / GGUF 导出：需要 torch。core 本身零 torch 依赖。
finetune = ["torch>=2.0"]
# 外部 MCP 工具源桥接（aicf/harness/tools/mcp.py，延迟导入，可选）
mcp = ["mcp>=1.2.0"]
# anthropic 线（aicf/infra/orchestrator/anthropic.py，延迟导入，可选）
anthropic = ["anthropic>=1.0.0"]
# SOCKS 代理穿透（aicf/infra/net.py，httpx 需要 socksio extra）
socks = ["httpx[socks]>=0.24"]
# Web / 语音 / 多媒体相关的全套运行时（应用层常用，core 本身不需要）
full = [
    "flask>=3.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "numpy>=1.24.0",
    "cryptography>=40.0.0",
    "rich>=13.0.0",
    "psutil>=5.9",
    "opencv-python>=4.8",
    "mcp>=1.2.0",
    "anthropic>=1.0.0",
]
all = [
    "flask>=3.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "numpy>=1.24.0",
    "cryptography>=40.0.0",
    "rich>=13.0.0",
    "psutil>=5.9",
    "opencv-python>=4.8",
    "mcp>=1.2.0",
    "anthropic>=1.0.0",
    "torch>=2.0",
]

[project.scripts]
# aicf —— 核心库的命令行门面。
# 装完 aicf-core 就有 aicf 命令，不需要再装第二个包。
aicf = "aicf.harness.cli.main:main"

[project.urls]
Homepage = "https://github.com/ccjjfdyqlhy/aicf-core"
Repository = "https://github.com/ccjjfdyqlhy/aicf-core"
Issues = "https://github.com/ccjjfdyqlhy/aicf-core/issues"

[tool.setuptools.packages.find]
# 顶层包只有一个：aicf。内部再分 aicf.harness（Agent 核心）与 aicf.infra（基础设施）。
#
# 为什么不再直接装顶层 harness/infra 这两个包：`harness` 与 `infra` 两个名字在 PyPI 上
# 已被他人占用，装包时会在全局命名空间里打架。框架不占别人的名字。
#
# 注意：分发名仍是 aicf-core（PyPI 上 `aicf` 这个名字与本项目过于相似，
# 申请新项目会被拒），import 名是 aicf.*，CLI 是 aicf —— 三者刻意不同。
include = ["aicf", "aicf.*"]

[tool.setuptools.package-data]
# 评测集随包分发：装完 aicf-core 就有 `aicf eval --dataset basic` 可用，
# 不需要再 clone 仓库才能跑通「90 秒上手」。
#
# 为什么放在 aicf/harness/ 而不是仓库根的 datasets/：
# 顶层 `datasets` 作为一个可 import 的包会污染全局命名空间，
# 而且和 HuggingFace 的 `datasets` 同名 —— 装 aicf-core 就会和别人打架。
# 放在 aicf/harness/ 下既是包数据，又不抢名字。
"aicf.harness" = ["datasets/*.yaml"]

[tool.pytest.ini_options]
# testpaths 限定收集范围：此前在仓库根裸跑 pytest 会扫进 temp/，
# 其中 temp/test_chatglm*.py 会在**收集期真的调用外部 LLM API**（实测 401/503）。
testpaths = ["tests"]
norecursedirs = ["temp", "prototypes", "logs", "node_modules", ".git",
                 "__pycache__", "MagicMock", ".split"]
python_files = ["test_*.py"]
markers = [
  "slow: 运行较慢的测试",
  "fault: 故障注入层（kill -9 / 重复投递 / 快照损坏等真故障，会起子进程）",
  "mutation: 变异测试层（拆掉实现里的保护，验证对应用例会变红；默认不跑）",
  "integration: 需要外部服务/设备/网络的测试",
  "known_broken: 已确认的资产漂移（断言依赖已变更的提示词/技能资产），待重新对齐",
  "script_not_test: 名为 test_*.py 但实为手动脚本，导入即执行，pytest 收集没有意义",
]
# 默认排除 known_broken（资产漂移用例）；想看它们：pytest -m known_broken
addopts = "--continue-on-collection-errors -m 'not known_broken'"

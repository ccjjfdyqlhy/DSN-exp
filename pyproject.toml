[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsn-harness"
version = "0.4.0"
description = "General-purpose Agent Harness framework & embedded SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
full = [
    "flask>=3.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "numpy>=1.24.0",
    "cryptography>=40.0.0",
    "rich>=13.0.0",
]

[tool.setuptools.packages.find]
include = ["harness", "harness.*"]

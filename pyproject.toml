[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicf"
version = "0.5.0"
description = "AICF — Agent Infrastructure Cybernetics Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
full = [
    "flask>=3.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "numpy>=1.24.0",
    "cryptography>=40.0.0",
    "rich>=13.0.0",
    "psutil>=5.9",
    "opencv-python>=4.8",
]

[tool.setuptools.packages.find]
include = ["harness", "harness.*", "infra", "infra.*"]

[tool.pytest.ini_options]
# testpaths 限定收集范围：此前在仓库根裸跑 pytest 会扫进 temp/，
# 其中 temp/test_chatglm*.py 会在**收集期真的调用外部 LLM API**（实测 401/503）。
testpaths = ["tests"]
norecursedirs = ["temp", "prototypes", "logs", "node_modules", ".git",
                 "__pycache__", "MagicMock"]
python_files = ["test_*.py"]
markers = [
  "slow: 运行较慢的测试",
  "integration: 需要外部服务/设备/网络的测试",
  "known_broken: 已确认的资产漂移（断言依赖已变更的提示词/技能资产），待重新对齐",
  "script_not_test: 名为 test_*.py 但实为手动脚本，导入即执行，pytest 收集没有意义",
]
# 默认排除 known_broken（资产漂移用例）；想看它们：pytest -m known_broken
addopts = "--continue-on-collection-errors -m 'not known_broken'"

name: file_manager
display_name: "文件管理"
description: "管理文件系统：探索文件系统、读写工作区文件"
version: "1.0"
author: "system"
source: "builtin"
enabled: true
status: "active"
prompt_category: "skills"
prompt_priority: 62

tools:
  # ── 文件系统探索（只读，默认 ~）──
  - name: explore_fs
    display_name: "探索文件系统"
    description: "探索文件系统目录和文件，默认用户主目录 ~。只读操作。"
    module: "tools.fs_explore"
    class: "FsExploreTool"
    methods:
      - name: explore_fs
        description: "执行文件系统探索操作"
        parameters:
          tool:
            type: string
            description: "子命令: list_dir（列出目录）或 read_file（读取文件）"
            required: true
          path:
            type: string
            description: "文件或目录路径，默认 ~"
            required: false

  # ── 工作区文件管理（可读写，默认 workspace）──
  - name: workspace_file
    display_name: "工作区文件管理"
    description: "管理工作区内的文件和目录。可读、写、列出。路径限制在工作区内。"
    module: "tools.workspace_file"
    class: "WorkspaceFileTool"
    methods:
      - name: workspace_file
        description: "执行工作区文件操作"
        parameters:
          tool:
            type: string
            description: "子命令: list_dir / read_file / write_file"
            required: true
          path:
            type: string
            description: "文件或目录相对路径"
            required: false
          content:
            type: string
            description: "写入内容（仅 write_file 时使用）"
            required: false

activation:
  keywords: ["文件", "目录", "读取", "写入", "列出", "保存", "浏览", "导航"]
  auto_activate: false

dependencies: []
tags: [files, io, system]

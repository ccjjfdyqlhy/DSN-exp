name: ncm_music
display_name: "网易云音乐"
description: "搜索歌曲/专辑/歌手/歌单，获取播放链接和歌词，下载歌曲到本地，管理歌单(创建/添加/移除)，每日签到，私人FM推荐，MV播放，喜欢歌曲，获取评论，用户资料"
version: "1.0"
author: "system"
source: "builtin"
enabled: true
status: "active"
prompt_category: "capabilities"
prompt_priority: 55

tags:
  - 音乐
  - 点歌
  - 网易云
  - 歌词
  - entertainment
  - download

activation:
  keywords:
    - 点歌
    - 放歌
    - 音乐
    - 歌单
    - 歌词
    - 网易云
    - 唱首歌
    - 来一首
    - 搜首歌
    - 播放
    - 听歌
    - 我想听
    - 下一首
    - 换首歌
    - 下载歌
    - 歌手
    - 专辑
    - 歌单
    - 排行榜
    - MV
    - 推荐
    - 签到
    - 评论
    - FM
    - 喜欢

tools:
  # ---- 会话管理 ----
  - name: login
    display_name: "登录网易云"
    description: "用 MUSIC_U Cookie 登录网易云音乐账号。如未配置 NCM_MUSIC_U 环境变量，需要从浏览器获取后传入。"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: login
        description: "配置 MUSIC_U 并登录"
        parameters:
          music_u:
            type: string
            description: "MUSIC_U Cookie 值（从 music.163.com 浏览器开发者工具 → Application → Cookies 获取）"
            required: true
          user_id:
            type: integer
            required: false
            description: "用户 ID，默认当前用户"

  - name: search_song
    display_name: "搜索歌曲"
    description: "根据关键词搜索网易云音乐的歌曲，返回歌曲列表（含歌曲名、歌手、专辑、时长、封面）。"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: search_song
        description: "搜索歌曲"
        parameters:
          keyword:
            type: string
            required: true
            description: "搜索关键词（歌名/歌手/专辑）"
          page:
            type: integer
            required: false
            description: "页数，默认1"
          num:
            type: integer
            required: false
            description: "每页数量，默认5"
          quality:
            type: integer
            required: false
            description: "音质: 1-2=标准128k, 3-4=HQ320k, 5-6=无损FLAC, 7-9=Hi-Res"
          auto_download:
            type: boolean
            required: false
            description: "是否自动下载第一首（需要登录态）"
          user_id:
            type: integer
            required: false
            description: "用户 ID，默认当前用户"

  - name: get_song_url
    display_name: "获取播放链接"
    description: "通过歌曲 ID 获取歌曲播放链接（直链）和详细信息（歌名/歌手/专辑/时长/封面）。音质越高越可能需 VIP。"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_song_url
        description: "获取播放链接"
        parameters:
          song_id:
            type: integer
            required: false
            description: "歌曲 ID"
          keyword:
            type: string
            required: false
            description: "搜索关键词，当 song_id=0 时用 keyword 搜索后取第 choose 首"
          choose:
            type: integer
            required: false
            description: "选择搜索结果第几首（配合 keyword 使用），默认1"
          quality:
            type: integer
            required: false
            description: "音质: 1-2=标准128k, 3-4=HQ320k, 5-6=无损FLAC, 7-9=Hi-Res"
          download:
            type: boolean
            required: false
            description: "是否下载到本地 workspace/<user>/music/ 目录"
          user_id:
            type: integer
            required: false
            description: "用户 ID，默认当前用户"

  - name: get_lyrics
    display_name: "获取歌词"
    description: "根据歌曲 ID 获取歌词，返回 LRC 时间轴歌词和纯文本歌词，可选择是否保存到本地文件。"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_lyrics
        description: "获取歌词"
        parameters:
          song_id:
            type: integer
            required: true
            description: "歌曲 ID"
          save:
            type: boolean
            required: false
            description: "是否保存歌词到本地 workspace/<user>/music/ 目录，默认true"
          user_id:
            type: integer
            required: false
            description: "用户 ID，默认当前用户"

  - name: music_control
    display_name: "控制音乐播放"
    description: "控制音乐播放器：播放/暂停/上下曲/调音量/查看状态。用户说「下一首」「暂停」「放歌」「现在在放什么」等均使用此工具。"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: music_control
        description: "发送播放控制命令"
        parameters:
          action:
            type: string
            required: true
            description: "控制命令: play(传filename) / pause / resume / stop / next / prev / volume(传0.0~1.0) / status(查看状态) / list(查看歌单)"
          value:
            type: string
            required: false
            description: "play 时传文件名（来自 list），volume 时传 0.0~1.0，其余留空"
          user_id:
            type: integer
            required: false
            description: "用户 ID，默认当前用户"

  - name: list_downloaded
    display_name: "列出已下载"
    description: "列出本地已下载的歌曲文件和歌词文件"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: list_downloaded
        description: "列出已下载的音乐文件"
        parameters:
          user_id:
            type: integer
            required: false
            description: "用户 ID，默认当前用户"

  - name: search
    display_name: "通用搜索"
    description: "搜索网易云音乐的歌曲/专辑/歌手/歌单/用户/MV等。比 search_song 支持更多类型。"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: search
        description: "通用搜索（支持多种类型）"
        parameters:
          keyword:
            type: string
            required: true
            description: "搜索关键词"
          search_type:
            type: string
            required: false
            description: "类型: song/album/artist/playlist/user/mv/lyrics/dj/video，默认 song"
          page:
            type: integer
            required: false
            description: "页数，默认1"
          num:
            type: integer
            required: false
            description: "每页数量，默认10"

  - name: get_album
    display_name: "获取专辑"
    description: "获取专辑详情（含曲目列表）"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_album
        description: "获取专辑详情"
        parameters:
          album_id:
            type: integer
            required: true
            description: "专辑 ID"

  - name: get_artist
    display_name: "获取歌手信息"
    description: "获取歌手的详细信息"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_artist
        description: "获取歌手详情"
        parameters:
          artist_id:
            type: integer
            required: true
            description: "歌手 ID"

  - name: get_artist_albums
    display_name: "歌手专辑列表"
    description: "获取歌手的专辑列表"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_artist_albums
        description: "获取歌手的专辑"
        parameters:
          artist_id:
            type: integer
            required: true
            description: "歌手 ID"
          page:
            type: integer
            required: false
            description: "页数，默认1"
          num:
            type: integer
            required: false
            description: "每页数量，默认50"

  - name: get_artist_tracks
    display_name: "歌手热门歌曲"
    description: "获取歌手的热门或最新歌曲"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_artist_tracks
        description: "获取歌手歌曲"
        parameters:
          artist_id:
            type: integer
            required: true
            description: "歌手 ID"
          page:
            type: integer
            required: false
            description: "页数，默认1"
          num:
            type: integer
            required: false
            description: "每页数量，默认50"
          order:
            type: string
            required: false
            description: "排序: hot(热门) / time(最新)，默认 hot"

  - name: get_playlist
    display_name: "获取歌单"
    description: "获取歌单的详情信息（不含完整曲目，用 get_playlist_tracks 获取全部歌曲）"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_playlist
        description: "获取歌单详情"
        parameters:
          playlist_id:
            type: integer
            required: true
            description: "歌单 ID"

  - name: get_playlist_tracks
    display_name: "歌单歌曲列表"
    description: "获取歌单内的所有歌曲"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_playlist_tracks
        description: "获取歌单歌曲"
        parameters:
          playlist_id:
            type: integer
            required: true
            description: "歌单 ID"
          offset:
            type: integer
            required: false
            description: "偏移，默认0"
          limit:
            type: integer
            required: false
            description: "获取数量，默认200"

  - name: create_playlist
    display_name: "创建歌单"
    description: "创建新的网易云音乐歌单"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: create_playlist
        description: "创建歌单"
        parameters:
          name:
            type: string
            required: true
            description: "歌单名称"
          private:
            type: boolean
            required: false
            description: "是否隐私歌单，默认 false"

  - name: add_to_playlist
    display_name: "添加歌曲到歌单"
    description: "将一首或多首歌曲添加到指定歌单"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: add_to_playlist
        description: "添加歌曲到歌单"
        parameters:
          playlist_id:
            type: integer
            required: true
            description: "歌单 ID"
          track_ids:
            type: array
            required: true
            description: "歌曲 ID 列表"
            items:
              type: integer

  - name: remove_from_playlist
    display_name: "从歌单移除歌曲"
    description: "从指定歌单移除歌曲"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: remove_from_playlist
        description: "从歌单移除歌曲"
        parameters:
          playlist_id:
            type: integer
            required: true
            description: "歌单 ID"
          track_ids:
            type: array
            required: true
            description: "歌曲 ID 列表"
            items:
              type: integer

  - name: get_user_playlists
    display_name: "用户歌单"
    description: "获取用户的歌单列表"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_user_playlists
        description: "获取用户歌单"
        parameters:
          user_id:
            type: integer
            required: false
            description: "用户 ID，默认当前登录用户"
          page:
            type: integer
            required: false
            description: "页数，默认1"
          num:
            type: integer
            required: false
            description: "每页数量，默认50"

  - name: get_daily_recommend
    display_name: "每日推荐"
    description: "获取网易云音乐每日推荐歌曲"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_daily_recommend
        description: "获取每日推荐"
        parameters: {}

  - name: get_user_detail
    display_name: "用户资料"
    description: "获取当前登录用户的网易云音乐资料"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_user_detail
        description: "获取用户资料"
        parameters:
          user_id:
            type: integer
            required: false
            description: "用户 ID，默认当前登录用户"

  - name: like_track
    display_name: "喜欢歌曲"
    description: "喜欢或取消喜欢一首歌曲"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: like_track
        description: "喜欢/取消喜欢歌曲"
        parameters:
          track_id:
            type: integer
            required: true
            description: "歌曲 ID"
          like:
            type: boolean
            required: false
            description: "true=喜欢，false=取消喜欢，默认 true"

  - name: get_track_comments
    display_name: "歌曲评论"
    description: "获取歌曲的热门评论和新评论"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_track_comments
        description: "获取歌曲评论"
        parameters:
          track_id:
            type: integer
            required: true
            description: "歌曲 ID"
          page:
            type: integer
            required: false
            description: "页数，默认1"
          num:
            type: integer
            required: false
            description: "每页数量，默认20"

  - name: get_personal_fm
    display_name: "私人 FM"
    description: "获取私人 FM 推荐歌曲（类似随机播放）"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_personal_fm
        description: "获取私人 FM"
        parameters:
          limit:
            type: integer
            required: false
            description: "获取数量，默认3"

  - name: skip_fm_track
    display_name: "跳过 FM 歌曲"
    description: "跳过私人 FM 当前播放的歌曲"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: skip_fm_track
        description: "跳过 FM 歌曲"
        parameters:
          track_id:
            type: integer
            required: true
            description: "要跳过的歌曲 ID"

  - name: like_fm_track
    display_name: "喜欢 FM 歌曲"
    description: "喜欢或取消喜欢私人 FM 中的歌曲"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: like_fm_track
        description: "喜欢/取消喜欢 FM 歌曲"
        parameters:
          track_id:
            type: integer
            required: true
            description: "歌曲 ID"
          like:
            type: boolean
            required: false
            description: "true=喜欢，false=取消喜欢，默认 true"

  - name: get_mv
    display_name: "获取 MV"
    description: "获取 MV 详情和播放地址"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: get_mv
        description: "获取 MV"
        parameters:
          mv_id:
            type: integer
            required: true
            description: "MV ID"
          resolution:
            type: integer
            required: false
            description: "分辨率 240/480/720/1080，默认 1080"

  - name: daily_signin
    display_name: "每日签到"
    description: "网易云音乐每日签到领取经验"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: daily_signin
        description: "每日签到"
        parameters:
          type:
            type: string
            required: false
            description: "mobile(手机+4经验) / web(网页+1经验)，默认 mobile"

  - name: login_logout
    display_name: "退出登录"
    description: "退出当前登录的网易云音乐账号"
    module: "tools.ncm_api"
    class: "NCMApi"
    methods:
      - name: login_logout
        description: "退出登录"
        parameters: {}

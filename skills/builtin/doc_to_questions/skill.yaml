name: doc_to_questions
display_name: "文档录入题库"
description: "从已处理的扫描文档（.hmd）或原始文本中提取题目，自动结构化录入题库系统。"
version: "1.0.0"
author: "system"
source: "builtin"
enabled: true
status: "active"
prompt_category: "skills"
prompt_priority: 72

tools:
  - name: process_hmd
    display_name: "从 HMD 文档提取题目"
    description: "读取 .hmd 扫描文档中的 OCR 文本，提取所有题目并批量录入题库。适用于已通过文档处理流程生成的 .hmd 文件。"
    module: "tools.doc_to_questions"
    class: "DocToQuestionsTool"
    methods:
      - name: process_hmd
        description: "从 .hmd 文件中提取题目并入库"
        parameters:
          hmd_path:
            type: string
            description: ".hmd 文件路径（来自 document.read_hmd 工具的 hmd_path 字段）"
            required: true
          subject_code:
            type: string
            description: "学科代码 (math/physics/chemistry/english/chinese/biology)"
            required: false
            default: "math"
          user_id:
            type: integer
            description: "用户 ID"
            required: false
            default: 1

  - name: process_text
    display_name: "从文本提取题目"
    description: "从原始文本（OCR 结果、粘贴的题目文本等）中提取所有题目，自动识别题型并批量录入题库。"
    module: "tools.doc_to_questions"
    class: "DocToQuestionsTool"
    methods:
      - name: process_text
        description: "从文本中提取题目并入库"
        parameters:
          text:
            type: string
            description: "包含题目的文本内容（可以是 OCR 识别结果、粘贴的试卷文本等）"
            required: true
          subject_code:
            type: string
            description: "学科代码 (math/physics/chemistry/english/chinese/biology)"
            required: false
            default: "math"
          user_id:
            type: integer
            description: "用户 ID"
            required: false
            default: 1

activation:
  keywords: ["录入题库", "提取题目", "导入题目", "识别题目", "录入", "入库", "doc_to_questions"]
  auto_activate: false

dependencies: []
tags: [document, question_bank, import, ocr, extract]

name: document
display_name: "文档处理"
description: "控制打印机和扫描仪：扫描纸质文档、OCR/HMD 处理、打印文件。"
version: "1.0.0"
author: "system"
source: "builtin"
enabled: true
status: "active"
prompt_category: "skills"
prompt_priority: 65

tools:
  # ---- 扫描 ----
  - name: list_scanners
    display_name: "列出扫描仪"
    description: "列出所有可用扫描仪设备及其描述"
    module: "tools.scanner"
    class: "ScannerTool"
    methods:
      - name: list_scanners
        description: "枚举系统中所有可用扫描仪"
        parameters: {}

  - name: scan
    display_name: "启动扫描"
    description: "对扫描台上的文档执行扫描，返回生成的 PNG 文件列表。扫描完成后文件保存在工作区。"
    module: "tools.scanner"
    class: "ScannerTool"
    methods:
      - name: scan
        description: "扫描文档为图片"
        parameters:
          resolution:
            type: integer
            description: "扫描分辨率 DPI (150/200/300/600)，默认 300"
            required: false
          mode:
            type: string
            description: "色彩模式: Color / Gray / Lineart，默认 Color"
            required: false
          user_id:
            type: integer
            description: "用户 ID，默认自动取当前用户"
            required: false

  # ---- 打印 ----
  - name: list_printers
    display_name: "列出打印机"
    description: "列出所有可用打印机及其状态"
    module: "tools.printer"
    class: "PrinterTool"
    methods:
      - name: list_printers
        description: "枚举 CUPS 中所有打印机"
        parameters: {}

  - name: print_file
    display_name: "打印文件"
    description: "将文件发送到打印机"
    module: "tools.printer"
    class: "PrinterTool"
    methods:
      - name: print_file
        description: "打印指定文件"
        parameters:
          file_path:
            type: string
            description: "要打印的文件路径（PDF/JPG/PNG 等）"
            required: true
          copies:
            type: integer
            description: "打印份数，默认 1"
            required: false
          page_range:
            type: string
            description: "页码范围，如 '1' / '1-3' / '1,3,5'"
            required: false

  # ---- 文档处理 ----
  - name: process_scan
    display_name: "处理扫描结果"
    description: "对扫描产出的 PNG 文件执行完整处理管线：分类→OCR→HMD→打包。返回反馈文本供 AI 理解文档内容。"
    module: "tools.doc_tools"
    class: "DocTools"
    methods:
      - name: process_scan
        description: "分类文档/图片、OCR 提取文本、调用 2md 布局分析、打包 .hmd"
        parameters:
          scanned_files:
            type: array
            description: "扫描产出的文件列表，格式: [{filename, filepath, size}, ...]"
            required: true
          user_id:
            type: integer
            description: "用户 ID，默认自动取当前用户"
            required: false

  - name: read_hmd
    display_name: "读取 HMD 文档"
    description: "解包 .hmd 文件，读取其中的 OCR 文本、布局信息和图片，供 AI 理解。"
    module: "tools.doc_tools"
    class: "DocTools"
    methods:
      - name: read_hmd
        description: "解包 .hmd 文件返回结构化内容"
        parameters:
          hmd_path:
            type: string
            description: ".hmd 文件路径"
            required: true

activation:
  keywords: ["扫描", "打印", "scan", "print", "扫一下", "录入", "印出来"]
  auto_activate: false

dependencies: []
tags: [document, scanner, printer, hardware]

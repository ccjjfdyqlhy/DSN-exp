# policies/approval.yaml — 审批策略（策划案 §6.1 / §4.4.3 的策略求值顺序）。
#
# 求值顺序（先命中先生效，由 RulePolicyEngine 保证）：
#   1. 显式 deny 规则 —— 永远赢
#   2. 越权检查（scope）
#   3. 显式 allow 规则
#   4. 风险阈值自动放行（auto_approve_risk）
#   5. 默认拒绝 → 人工审批
#
# 消费：`aicf/infra/policy/loader.py::load_policy_file('policies/approval.yaml')`
#       → RulePolicyEngine，装配进 ToolGuard。
#
# fail-closed 是硬约束：这里的任何一条规则写错，加载器直接抛错，
# 绝不「跳过坏规则继续跑」。

rules:
  # 1. 显式拒绝：破坏性模式不允许跑（rm -rf / drop table 类）
  - action: deny
    id: deny-destructive
    tool_prefix: proc.
    reason: proc 命令一律走沙箱白名单，破坏性调用直接拒绝
  # 2. 显式放行：只读文件访问
  - action: allow
    id: allow-fs-read
    tool_prefix: fs.read
    effect: pure
    reason: 只读工具自动放行
  # 3. 显式放行：MCP 桥接的搜索类工具（pure）
  - action: allow
    id: allow-mcp-search
    tool_prefix: mcp.
    effect: pure
    reason: MCP 只读检索放行

# 风险阈值自动放行：低于等于 medium 的自动放行 ——
# effectful 工具被 compute_risk 定为 high，仍会落到人工审批。
auto_approve_risk: medium
# 只读工具白名单（策划案 §4.4.3 第 3 条的兜底）
allow_readonly: true

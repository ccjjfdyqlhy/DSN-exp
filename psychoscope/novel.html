<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archive - Interactive Novel</title>
    <style>
        @font-face {
            font-family: 'LanaPixel';
            src: url('./assets/LanaPixel.ttf');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'LanaPixel', -apple-system, sans-serif;
            color: white;
            background: #0a0a0a;
            cursor: pointer; /* 提示用户可以点击 */
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(30, 30, 30, 1) 0%, rgba(10, 10, 10, 1) 100%);
            z-index: 0;
            pointer-events: none;
        }

        #main-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        #text-box-wrapper {
            flex: 1;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            padding: 0 40px;
        }

        #text-box-wrapper::-webkit-scrollbar { width: 0px; }

        #text-box {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 100%;
            padding-bottom: 35vh;
            padding-top: 15vh;
        }

        #bottom-anchor {
            height: 10px;
            width: 100%;
        }

        .text-line {
            font-size: 22px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            margin-bottom: 24px;
            opacity: 0;
            will-change: transform, opacity, filter;
            transition: 
                transform 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                filter 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                margin 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            transform: translateY(30px) translateZ(0);
        }

        .text-line.active {
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
            transform: translateY(0) scale(1.02) translateZ(0);
            margin-top: 4vh;
            margin-bottom: 6vh;
        }

        .text-line.active-group-top {
            opacity: 0.8;
            transform: translateY(0) scale(1) translateZ(0);
            margin-top: 2vh;
            margin-bottom: 8px;
        }

        .text-line.active-group-bottom {
            opacity: 1;
            color: #f1c40f;
            transform: translateY(0) scale(1.05) translateZ(0);
            margin-top: 0;
            margin-bottom: 6vh;
            filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.4));
        }

        .text-line.history {
            opacity: 0.15;
            filter: blur(1.5px) grayscale(1);
            transform: translateY(-10px) scale(0.95) translateZ(0);
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .scrolling-up .text-line.history {
            opacity: 0.6;
            filter: blur(0) grayscale(0);
            transform: translateY(0) scale(1) translateZ(0);
        }

        .speaker {
            font-weight: bold;
            color: rgba(255,255,255,0.5);
            margin-right: 12px;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #f1c40f;
            margin-left: 4px;
            vertical-align: middle;
            animation: cursorBlink 0.6s step-end infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #choices-container {
            position: fixed;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 150;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
            pointer-events: all;
        }

        .scrolling-up #choices-container {
            transform: translate(-50%, 150%);
            opacity: 0;
            pointer-events: none;
        }

        .choice-btn {
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            font-family: 'LanaPixel', sans-serif;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .choice-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: black;
            border-color: white;
            transform: translateX(10px);
            backdrop-filter: none;
        }

        #scroll-bottom-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
            transition: 0.3s;
        }

        #scroll-bottom-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }

        #status-bar {
            position: fixed;
            bottom: 30px;
            left: 40px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 3px;
            pointer-events: none;
        }

        /* 点击继续提示灯 */
        #continue-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 4px;
            opacity: 0;
            transition: 0.5s;
            pointer-events: none;
        }

        #continue-indicator.visible { opacity: 1; }

        @keyframes choiceIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body onclick="handleGlobalClick()">
<div id="background"></div>
<div id="main-container">
    <div id="text-box-wrapper">
        <div id="text-box">
            <div id="bottom-anchor"></div>
        </div>
    </div>
    <div id="choices-container"></div>
</div>
<div id="status-bar"></div>
<div id="continue-indicator">CLICK TO CONTINUE</div>
<button id="scroll-bottom-btn" onclick="backToBottom(event)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
</button>

<script>
let gameState = {
    sceneId: 'start',
    history: [],
    choices: null,
    isTyping: false,
    autoScroll: true,
    isPaused: false,
    waitingForInput: false,
    inputResolver: null
};

const textBox = document.getElementById('text-box');
const textBoxWrapper = document.getElementById('text-box-wrapper');
const choicesContainer = document.getElementById('choices-container');
const scrollBtn = document.getElementById('scroll-bottom-btn');
const bottomAnchor = document.getElementById('bottom-anchor');
const indicator = document.getElementById('continue-indicator');
const API_URL = 'http://localhost:5000';

const wait = (ms) => new Promise(r => setTimeout(r, ms));

// 点击处理：解决等待中的 Promise
function handleGlobalClick() {
    if (gameState.waitingForInput && gameState.inputResolver) {
        indicator.classList.remove('visible');
        gameState.waitingForInput = false;
        gameState.inputResolver();
    }
}

const waitForPlayer = () => {
    gameState.waitingForInput = true;
    indicator.classList.add('visible');
    return new Promise(resolve => {
        gameState.inputResolver = resolve;
    });
};

const observer = new IntersectionObserver((entries) => {
    const entry = entries[0];
    if (entry.isIntersecting) {
        textBoxWrapper.classList.remove('scrolling-up');
        scrollBtn.style.display = 'none';
        gameState.autoScroll = true;
        gameState.isPaused = false; 
    } else {
        textBoxWrapper.classList.add('scrolling-up');
        scrollBtn.style.display = 'flex';
        gameState.autoScroll = false;
        gameState.isPaused = true; 
    }
}, { threshold: 0.1 });

observer.observe(bottomAnchor);

const backToBottom = (e) => {
    if(e) e.stopPropagation();
    textBoxWrapper.scrollTo({ top: textBoxWrapper.scrollHeight, behavior: 'smooth' });
};

const scrollToBottom = () => {
    if (gameState.autoScroll) {
        textBoxWrapper.scrollTo({ top: textBoxWrapper.scrollHeight, behavior: 'smooth' });
    }
};

const archiveActiveLines = () => {
    const activeLines = textBox.querySelectorAll('.text-line:not(.history)');
    activeLines.forEach(line => {
        line.classList.remove('active', 'active-group-top', 'active-group-bottom');
        line.classList.add('history');
    });
};

const typeText = async (element, text, speed = 30) => {
    gameState.isTyping = true;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    element.appendChild(cursor);

    for (let i = 0; i < text.length; i++) {
        while (gameState.isPaused) await wait(100);
        cursor.before(text[i]);
        let delay = speed + Math.random() * 20;
        if (['，', ',', '。', '.', '！', '!', '？', '?', '…'].includes(text[i])) delay += 400; 
        if (i % 2 === 0) scrollToBottom();
        await wait(delay);
    }
    cursor.remove();
    gameState.isTyping = false;
};

const addMessage = async (speaker, text, isInteraction = false) => {
    if (!isInteraction) archiveActiveLines();
    const lineEl = document.createElement('div');
    lineEl.className = 'text-line';
    textBox.insertBefore(lineEl, bottomAnchor);
    
    requestAnimationFrame(() => {
        lineEl.classList.add('active');
        if (isInteraction) {
            const prevLine = lineEl.previousElementSibling;
            if (prevLine && !prevLine.classList.contains('history')) {
                prevLine.classList.replace('active', 'active-group-top');
                lineEl.classList.replace('active', 'active-group-bottom');
            }
        }
    });

    if (speaker) {
        const speakerSpan = document.createElement('span');
        speakerSpan.className = 'speaker';
        speakerSpan.textContent = speaker.toUpperCase();
        lineEl.appendChild(speakerSpan);
    }

    const textSpan = document.createElement('span');
    lineEl.appendChild(textSpan);
    await typeText(textSpan, text);
};

const displayChoices = async (choices) => {
    choicesContainer.innerHTML = '';
    gameState.choices = choices;
    for (let i = 0; i < choices.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choices[i].text;
        btn.style.animation = `choiceIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards ${i * 0.1}s`;
        btn.onclick = (e) => {
            e.stopPropagation();
            selectChoice(choices[i].nextScene, choices[i].text);
        };
        choicesContainer.appendChild(btn);
    }
};

const selectChoice = async (nextScene, choiceText) => {
    if (gameState.isTyping || gameState.isPaused) return;
    choicesContainer.innerHTML = '';
    await addMessage('>', choiceText, true);
    await wait(600);
    gameState.sceneId = nextScene;
    archiveActiveLines();
    await wait(400);
    await loadScene(nextScene);
};

const loadScene = async (sceneId) => {
    try {
        updateStatusBar();
        const res = await fetch(`${API_URL}/scene/${sceneId}`);
        if (!res.ok) throw new Error("SCENE_NOT_FOUND");
        const scene = await res.json();
        gameState.history.push(sceneId);

        // 处理叙事文本
        if (scene.narration) {
            await addMessage(null, scene.narration);
            // 核心逻辑：判断是否自动切换或点击切换
            if (scene.auto_delay_narration) await wait(scene.auto_delay_narration);
            else await waitForPlayer();
        }

        // 处理对话流
        const msgs = scene.messages || [];
        for (let i = 0; i < msgs.length; i++) {
            const msg = msgs[i];
            await addMessage(msg.type === 'dialogue' ? msg.speaker : null, msg.text);
            
            // 如果不是最后一条且没有选项，或者后面还有消息，执行等待
            if (i < msgs.length - 1 || (scene.choices && scene.choices.length > 0) || scene.nextScene) {
                if (msg.auto_delay) await wait(msg.auto_delay);
                else await waitForPlayer();
            }
        }

        if (scene.choices && scene.choices.length > 0) {
            displayChoices(scene.choices);
        } else if (scene.nextScene) {
            gameState.sceneId = scene.nextScene;
            archiveActiveLines();
            await loadScene(scene.nextScene);
        }
    } catch (error) {
        addMessage('SYSTEM', `CRITICAL ERROR: DATA_FETCH_FAILED [${error.message}]`);
    }
};

const updateStatusBar = () => {
    document.getElementById('status-bar').textContent = `INDEX: ${gameState.history.length}`;
};

window.addEventListener('load', () => loadScene('start'));
</script>
</body>
</html>

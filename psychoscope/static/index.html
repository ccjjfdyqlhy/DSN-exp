<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        (function(){var t=localStorage.getItem('psychoscope_theme');if(!t){t=new Date().getHours()>=6&&new Date().getHours()<18?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DSN-exp — Psychoscope</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div id="background"></div>

<div id="main-container">
    <div id="text-box-wrapper">
        <div id="text-box">
            <div id="bottom-anchor"></div>
        </div>
    </div>
</div>

<div id="input-area">
    <div id="image-preview" class="hidden">
        <img id="preview-img" src="" alt="preview">
        <button id="btn-remove-image" title="移除图片">&times;</button>
    </div>
    <div class="input-wrapper" data-key-hint="Enter:换行|Ctrl+Enter:发送">
        <button id="btn-tts" class="btn-tts" title="语音播报：关" data-key-hint="Alt+T:切换语音">♪</button>
        <input type="file" id="image-input" accept="image/*" style="display:none;">
        <button id="btn-image" title="上传图片">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
            </svg>
        </button>
        <textarea id="message-input" placeholder="输入消息" autofocus rows="1"></textarea>
        <button id="btn-send">→</button>
    </div>
</div>

<div id="footer-bar">
    <span class="footer-brand">DSN-exp</span>
    <span class="footer-version">V4-API</span>
    <span class="footer-spacer"></span>
    <span class="footer-hint">
        <svg class="key-icon alt-key" width="22" height="18" viewBox="0 0 22 18">
            <rect x="1" y="1" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
            <text x="11" y="12" text-anchor="middle" font-size="8" fill="currentColor" font-family="LanaPixel">Alt</text>
        </svg>
        <span>查看键位</span>
    </span>
</div>

<div id="header">
    <span class="header-brand">PSYCHOSCOPE</span>
    <span class="header-divider">|</span>
    <span class="header-sub">DSN-exp</span>
    <div class="header-actions">
        <button id="btn-new-chat" title="新对话">+</button>
        <button id="btn-chat-list" title="对话列表">☰</button>
        <button id="btn-theme" title="切换主题">◐</button>
        <button id="btn-logout" title="退出" data-key-hint="Ctrl+Q:退出登录">⏻</button>
    </div>
</div>

<div id="status-bar"></div>

<button id="scroll-bottom-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
</button>

<div id="sidebar" class="hidden">
    <div id="sidebar-header">
        <span>对话列表</span>
        <button id="btn-close-sidebar">&times;</button>
    </div>
    <div id="chat-list"></div>
</div>

<div id="login-overlay">
    <div class="login-content">
        <h1>DSN-exp</h1>
        <p>PSYCHOSCOPE CLIENT</p>
        <div id="pairing-section" style="display:none">
            <p class="section-title">新设备绑定</p>
            <input id="pairing-code" type="text" placeholder="管理员提供的配对码" maxlength="8" autocomplete="off" />
            <input id="user-name" type="text" placeholder="你的名字" autocomplete="off" />
            <button id="btn-pair">绑定</button>
        </div>
        <div id="recover-section-fallback" style="display:none">
            <p class="section-title">等待管理员在控制台输入 /newbind 生成配对码...</p>
        </div>
        <div class="or-divider">— 或 —</div>
        <div id="recover-section">
            <p class="section-title">已有账号？恢复登录</p>
            <input id="recover-user-id" type="text" placeholder="用户名" autocomplete="off" />
            <button id="btn-recover">恢复</button>
        </div>
        <span class="login-hint" id="login-status"></span>
    </div>
</div>

<div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
</div>

<div id="notification" class="hidden"></div>

<script src="/static/js/typewriter.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>

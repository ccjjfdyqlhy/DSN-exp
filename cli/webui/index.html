<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXA - AI Assistant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme-dark">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme-light" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ── Dark theme (default) ── */
:root {
  --bg: #0a0a0f; --surface: #12121a; --sidebar: #0d0d14;
  --border: #1e293b; --accent: #7c3aed; --accent-hover: #6d28d9;
  --accent-light: #a78bfa; --cyan: #06b6d4; --text: #e2e8f0;
  --text-secondary: #94a3b8; --text-muted: #64748b;
  --user-bubble: #7c3aed; --ai-text: #e2e8f0;
  --success: #10b981; --error: #ef4444;
  --input-bg: #0a0a0f; --code-bg: #0d1117;
  --hover-row: rgba(124,58,237,0.08); --active-row: rgba(124,58,237,0.15);
  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --tag-bg: rgba(124,58,237,0.07);
}

/* ── Light theme ── */
body.light {
  --bg: #f8fafc; --surface: #ffffff; --sidebar: #f1f5f9;
  --border: #e2e8f0; --accent: #7c3aed; --accent-hover: #6d28d9;
  --accent-light: #6d28d9; --cyan: #0891b2; --text: #1e293b;
  --text-secondary: #64748b; --text-muted: #94a3b8;
  --user-bubble: #7c3aed; --ai-text: #1e293b;
  --success: #059669; --error: #dc2626;
  --input-bg: #f1f5f9; --code-bg: #f1f5f9;
  --hover-row: rgba(124,58,237,0.06); --active-row: rgba(124,58,237,0.12);
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
  --tag-bg: rgba(124,58,237,0.05);
  color-scheme: light;
}
body.light ::-webkit-scrollbar-track { background: var(--bg); }
body.light ::-webkit-scrollbar-thumb { background: #cbd5e1; }
body.light .msg-bubble pre { border-color: #e2e8f0; }
body.light #message-input::placeholder { color: #94a3b8; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; overflow: hidden; display: flex;
}
a { color: var(--accent-light); text-decoration: none; }

/* ── Login Screen ── */
#login-screen {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: var(--bg); z-index: 1000;
}
#login-screen .logo { font-size: 56px; font-weight: 800; color: var(--accent-light); margin-bottom: 8px; letter-spacing: 4px; }
#login-screen .subtitle { color: var(--text-secondary); font-size: 16px; margin-bottom: 32px; }
.api-config-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
.api-label { color: var(--text-secondary); font-size: 13px; white-space: nowrap; }
.api-input {
  padding: 10px 14px; font-size: 14px; background: var(--input-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; width: 260px;
  transition: border-color 0.15s;
}
.api-input:focus { border-color: var(--accent); }
.api-apply-btn {
  padding: 10px 18px; font-size: 13px; font-weight: 500;
  background: transparent; color: var(--accent-light); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.api-apply-btn:hover { background: rgba(124,58,237,0.1); border-color: var(--accent); }
.api-status { margin-bottom: 12px; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
.api-status.ok { color: var(--success); background: rgba(16,185,129,0.1); }
.api-status.err { color: var(--error); background: rgba(239,68,68,0.1); }
.btn-login {
  padding: 14px 48px; font-size: 16px; font-weight: 600;
  background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
  cursor: pointer; transition: all 0.2s; box-shadow: 0 0 20px rgba(124,58,237,0.3);
}
.btn-login:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 0 30px rgba(124,58,237,0.5); }
.btn-login:disabled { background: #6b7280; cursor: not-allowed; box-shadow: none; transform: none; }
#login-screen .loading-dots { margin-top: 16px; color: var(--text-secondary); font-size: 14px; }
#login-screen .error-msg { color: var(--error); margin-top: 16px; font-size: 14px; }

/* ── Layout ── */
#app { display: flex; width: 100%; height: 100%; }
#sidebar {
  width: 280px; min-width: 280px; height: 100%;
  background: var(--sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 10;
}
#main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }

/* ── Sidebar ── */
.sidebar-header {
  padding: 20px 16px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-header .logo-small { font-size: 22px; font-weight: 700; color: var(--accent-light); letter-spacing: 2px; }
.sidebar-header-actions { display: flex; gap: 6px; }
.btn-icon {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.btn-icon:hover { background: var(--surface); color: var(--text); border-color: var(--accent); }
#btn-close-sidebar { display: none; }
.btn-new-chat {
  margin: 12px 16px; padding: 10px 16px; font-size: 14px; font-weight: 500;
  background: transparent; color: var(--accent-light); border: 1px dashed var(--border);
  border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
}
.btn-new-chat:hover { background: rgba(124,58,237,0.1); border-color: var(--accent); }
.chat-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.chat-list::-webkit-scrollbar { width: 4px; }
.chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.chat-item {
  padding: 10px 12px; margin: 2px 0; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 14px; color: var(--text-secondary);
  display: flex; align-items: center; justify-content: space-between;
  transition: background 0.1s; white-space: nowrap; overflow: hidden;
}
.chat-item:hover { background: var(--hover-row); }
.chat-item.active { background: var(--active-row); color: var(--text); }
.chat-item .chat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.chat-item .chat-count { font-size: 11px; color: var(--text-secondary); margin-left: 8px; opacity: 0.6; }
.chat-item .btn-del {
  opacity: 0; width: 24px; height: 24px; border-radius: 4px; border: none;
  background: transparent; color: var(--error); cursor: pointer; font-size: 14px;
  transition: all 0.15s; margin-left: 4px; display: flex; align-items: center; justify-content: center;
}
.chat-item:hover .btn-del { opacity: 0.6; }
.chat-item .btn-del:hover { opacity: 1; background: rgba(239,68,68,0.15); }
.sidebar-footer {
  padding: 12px 16px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.sidebar-footer .user-name { font-size: 13px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-footer .btn-logout {
  font-size: 12px; color: var(--text-secondary); background: none; border: none;
  cursor: pointer; padding: 4px 8px; border-radius: 4px;
}
.sidebar-footer .btn-logout:hover { color: var(--error); background: rgba(239,68,68,0.1); }

/* ── Chat Header ── */
#chat-header {
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); flex-shrink: 0;
}
#chat-header .chat-title { font-size: 16px; font-weight: 600; color: var(--text); }
#chat-header .model-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 12px;
  background: rgba(6,182,212,0.1); color: var(--cyan); font-weight: 500;
  border: 1px solid rgba(6,182,212,0.2);
}
.chat-header-actions { display: flex; gap: 8px; align-items: center; }
.chat-header-actions select {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; cursor: pointer; outline: none;
}
.chat-header-actions select:focus { border-color: var(--accent); }

/* ── Messages ── */
#messages {
  flex: 1; overflow-y: auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px;
}
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
.empty-chat {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-secondary); gap: 12px;
}
.empty-chat .empty-icon { font-size: 40px; opacity: 0.3; }
.empty-chat .empty-text { font-size: 16px; }
.empty-chat .empty-hint { font-size: 13px; color: var(--text-muted); }

/* ── Message rows (no avatars) ── */
.msg-row { display: flex; flex-direction: column; max-width: 80%; animation: fadeIn 0.25s ease; }
.msg-row.user { align-self: flex-end; }
.msg-row.assistant { align-self: flex-start; }
.msg-row.system { align-self: center; max-width: 70%; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.msg-row.user .msg-bubble {
  background: var(--user-bubble); color: #fff; padding: 10px 16px; border-radius: var(--radius);
  border-bottom-right-radius: 4px; font-size: 14px; line-height: 1.6; word-break: break-word;
}

/* AI: flat markdown, no bubble */
.msg-row.assistant .msg-content {
  font-size: 14px; line-height: 1.75; color: var(--ai-text); word-break: break-word;
}
.msg-row.assistant .msg-content p { margin: 8px 0; }
.msg-row.assistant .msg-content p:first-child { margin-top: 0; }
.msg-row.assistant .msg-content p:last-child { margin-bottom: 0; }
.msg-row.assistant .msg-content h1, .msg-content h2, .msg-content h3 { margin: 12px 0 6px; font-weight: 600; }
.msg-row.assistant .msg-content h1 { font-size: 1.3em; }
.msg-row.assistant .msg-content h2 { font-size: 1.15em; }
.msg-row.assistant .msg-content h3 { font-size: 1.05em; }
.msg-row.assistant .msg-content ul, .msg-content ol { padding-left: 20px; margin: 8px 0; }
.msg-row.assistant .msg-content li { margin: 4px 0; }
.msg-row.assistant .msg-content blockquote {
  border-left: 3px solid var(--accent); padding: 4px 12px; margin: 8px 0;
  color: var(--text-secondary); background: rgba(124,58,237,0.05); border-radius: 0 4px 4px 0;
}
.msg-row.assistant .msg-content table { border-collapse: collapse; width: 100%; margin: 8px 0; }
.msg-row.assistant .msg-content th, .msg-content td { border: 1px solid var(--border); padding: 6px 12px; font-size: 13px; text-align: left; }
.msg-row.assistant .msg-content th { background: rgba(124,58,237,0.1); font-weight: 600; }
.msg-row.assistant .msg-content pre {
  background: var(--code-bg); border-radius: 8px; padding: 14px 18px; overflow-x: auto;
  margin: 10px 0; border: 1px solid var(--border); font-size: 13px;
}
.msg-row.assistant .msg-content code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
.msg-row.assistant .msg-content p code, .msg-content li code {
  background: rgba(124,58,237,0.15); padding: 2px 6px; border-radius: 4px;
  font-size: 13px; color: var(--accent-light);
}

.msg-row.system .msg-bubble {
  background: transparent; color: var(--text-muted); font-size: 12px;
  text-align: center; border: 1px dashed var(--border); border-radius: 20px; padding: 4px 14px;
}

/* ── Streaming indicator ── */
.typing-indicator { display: flex; gap: 4px; padding: 6px 0; }
.typing-indicator span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
  animation: bounce 1.2s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}
.status-tag {
  font-size: 11px; color: var(--text-secondary); padding: 4px 8px;
  border-radius: 4px; background: var(--tag-bg);
  display: inline-flex; align-items: center; gap: 6px;
}

/* ── Input Area ── */
#input-area {
  padding: 16px 24px; border-top: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.input-row { display: flex; gap: 10px; align-items: flex-end; }
#message-input {
  flex: 1; padding: 12px 16px; font-size: 14px; line-height: 1.5;
  background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); resize: none; outline: none;
  font-family: inherit; max-height: 160px; min-height: 44px;
  transition: border-color 0.15s;
}
#message-input:focus { border-color: var(--accent); }
#message-input::placeholder { color: #475569; }
.btn-send {
  width: 44px; height: 44px; border-radius: var(--radius);
  background: var(--accent); color: #fff; border: none; cursor: pointer;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.btn-send:hover { background: var(--accent-hover); }
.btn-send:disabled { background: #6b7280; cursor: not-allowed; }
.btn-mic {
  width: 40px; height: 40px; border-radius: 50%;
  background: transparent; color: var(--text-secondary); border: 1px solid var(--border);
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.btn-mic:hover { border-color: var(--accent); color: var(--accent-light); }
.btn-mic.recording { background: var(--error); border-color: var(--error); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
.btn-tts {
  width: 40px; height: 40px; border-radius: 50%;
  background: transparent; color: var(--text-secondary); border: 1px solid var(--border);
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.btn-tts:hover { border-color: var(--accent); color: var(--accent-light); }
.btn-tts.active { border-color: var(--cyan); color: var(--cyan); background: rgba(6,182,212,0.1); }

/* ── Mobile ── */
.menu-toggle {
  display: none; position: fixed; top: 12px; left: 12px; z-index: 100;
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent);
  color: #fff; border: none; cursor: pointer; font-size: 18px;
  align-items: center; justify-content: center; box-shadow: var(--shadow);
}
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9; }
@media (max-width: 768px) {
  .menu-toggle { display: flex; }
  #btn-close-sidebar { display: flex; }
  #sidebar { position: fixed; left: -100%; top: 0; bottom: 0; width: 280px; transition: left 0.3s ease; z-index: 10; }
  #sidebar.open { left: 0; }
  .sidebar-overlay.open { display: block; }
  #messages { padding: 16px; }
  #input-area { padding: 12px 16px; }
  #chat-header { padding: 12px 16px; }
  .msg-row { max-width: 90%; }
}

/* ── Toast ── */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px;
  color: #fff; animation: slideIn 0.3s ease; box-shadow: var(--shadow);
}
.toast.error { background: var(--error); }
.toast.success { background: var(--success); }
.toast.info { background: var(--accent); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<!-- ─── Login Screen ─── -->
<div id="login-screen">
  <div class="logo">EXA</div>
  <div class="subtitle">AI Assistant · Powered by DeepSeek</div>
  <div class="api-config-row">
    <label class="api-label">API 服务器</label>
    <input class="api-input" id="api-server-input" type="text" placeholder="http://localhost:5000">
    <button class="api-apply-btn" onclick="applyApiServer()">连接</button>
  </div>
  <div id="api-status" class="api-status" style="display:none"></div>
  <button class="btn-login" id="btn-login" onclick="handleLogin()" disabled>通过 LittleSkin 登录</button>
  <div id="login-loading" class="loading-dots" style="display:none">正在跳转到登录页面...</div>
  <div id="login-error" class="error-msg" style="display:none"></div>
</div>

<!-- ─── Main App ─── -->
<div id="app" style="display:none">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="logo-small">EXA</span>
      <div class="sidebar-header-actions">
        <button class="btn-icon" id="btn-theme" onclick="toggleTheme()" title="切换主题">🌙</button>
        <button class="btn-icon" onclick="toggleSidebar()" title="关闭侧栏" id="btn-close-sidebar">✕</button>
      </div>
    </div>
    <button class="btn-new-chat" onclick="createNewChat()">+ 新建对话</button>
    <div class="chat-list" id="chat-list"></div>
    <div class="sidebar-footer">
      <span class="user-name" id="user-name">未登录</span>
      <button class="btn-logout" onclick="handleLogout()">退出</button>
    </div>
  </aside>

  <main id="main">
    <header id="chat-header">
      <span class="chat-title" id="chat-title">选择一个对话</span>
      <div class="chat-header-actions">
        <select id="model-select" onchange="onModelChange(this.value)" title="模型选择">
          <option value="">默认模型</option>
          <option value="deepseek">DeepSeek (Pro)</option>
          <option value="fast">LMStudio (Fast)</option>
        </select>
        <span class="model-badge" id="model-badge">DeepSeek</span>
      </div>
    </header>

    <div id="messages">
      <div class="empty-chat" id="empty-chat">
        <div class="empty-icon">✨</div>
        <div class="empty-text">EXA AI Assistant</div>
        <div class="empty-hint">在下方输入消息开始对话</div>
      </div>
    </div>

    <div id="input-area">
      <div class="input-row">
        <button class="btn-mic" id="btn-mic" onclick="toggleRecording()" title="语音输入">🎤</button>
        <textarea id="message-input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
        <button class="btn-tts active" id="btn-tts" onclick="toggleTTS()" title="语音播报">🔊</button>
        <button class="btn-send" id="btn-send" onclick="sendMessage()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22,2 11,13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
const state = {
  token: null, user: null,
  chats: [], currentChatId: null, messages: [],
  ttsEnabled: true, modelType: null,
  streaming: false,
  recording: false, mediaRecorder: null, audioChunks: [],
  sidebarOpen: false, pendingChatName: null,
  apiBase: 'http://localhost:5000', apiVerified: false,
  theme: localStorage.getItem('exa_theme') || 'dark'
};

// ═══════════════════════════════════════════
//  API URL helpers
// ═══════════════════════════════════════════
function apiUrl(path) { return state.apiBase.replace(/\/+$/, '') + path; }

function initApiBase() {
  const params = new URLSearchParams(window.location.search);
  const fromUrl = params.get('api');
  if (fromUrl) {
    state.apiBase = fromUrl;
    localStorage.setItem('exa_api_base', fromUrl);
  } else {
    const saved = localStorage.getItem('exa_api_base');
    if (saved) state.apiBase = saved;
  }
  document.getElementById('api-server-input').value = state.apiBase;
}

async function applyApiServer() {
  const input = document.getElementById('api-server-input');
  const url = input.value.trim().replace(/\/+$/, '') || 'http://localhost:5000';
  state.apiBase = url;
  state.apiVerified = false;
  localStorage.setItem('exa_api_base', url);

  const statusEl = document.getElementById('api-status');
  const btnLogin = document.getElementById('btn-login');
  statusEl.style.display = 'block';
  statusEl.textContent = '⏳ 正在测试连接...';
  statusEl.className = 'api-status';

  try {
    const res = await fetch(apiUrl('/api/auth/start?redirect_uri=' + encodeURIComponent(window.location.origin + window.location.pathname)));
    if (res.ok) {
      statusEl.textContent = '✓ 服务器连接成功';
      statusEl.className = 'api-status ok';
      state.apiVerified = true;
      btnLogin.disabled = false;
    } else {
      statusEl.textContent = '✗ 服务器返回错误 (HTTP ' + res.status + ')';
      statusEl.className = 'api-status err';
    }
  } catch (e) {
    statusEl.textContent = '✗ 无法连接到服务器: ' + e.message;
    statusEl.className = 'api-status err';
  }
}

// ═══════════════════════════════════════════
//  Theme
// ═══════════════════════════════════════════
function applyTheme() {
  const light = state.theme === 'light';
  document.body.classList.toggle('light', light);
  document.getElementById('btn-theme').textContent = light ? '☀️' : '🌙';
  document.getElementById('btn-theme').title = light ? '深色模式' : '浅色模式';
  document.getElementById('hljs-theme-dark').disabled = light;
  document.getElementById('hljs-theme-light').disabled = !light;
  localStorage.setItem('exa_theme', state.theme);
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
}

// ═══════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  applyTheme();
  initApiBase();

  // Try loading saved credentials from webui server
  try {
    const resp = await fetch('/_webui/token');
    if (resp.ok) {
      const data = await resp.json();
      if (data.token) {
        state.token = data.token;
        const payload = parseJWT(data.token);
        if (payload) {
          state.user = { uid: payload.uid, nickname: payload.nickname, email: payload.email };
          state.apiVerified = true;
          document.getElementById('btn-login').disabled = false;
          showApp();
          return;
        }
      }
    }
  } catch (e) { /* webui server not available, fall through */ }

  // Fallback: check URL params then localStorage
  const params = new URLSearchParams(window.location.search);
  const tokenFromUrl = params.get('token');
  if (tokenFromUrl) {
    state.token = tokenFromUrl;
    localStorage.setItem('exa_token', tokenFromUrl);
    // Also store on webui server
    try { await fetch('/_webui/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: tokenFromUrl }) }); } catch(e) {}
    window.history.replaceState({}, document.title, window.location.pathname);
  } else {
    state.token = localStorage.getItem('exa_token');
  }

  if (state.token) {
    try {
      const payload = parseJWT(state.token);
      if (payload) {
        state.user = { uid: payload.uid, nickname: payload.nickname, email: payload.email };
        state.apiVerified = true;
        document.getElementById('btn-login').disabled = false;
        showApp();
      }
    } catch (e) { localStorage.removeItem('exa_token'); state.token = null; }
  }

  // Auto-verify API if URL was saved
  if (localStorage.getItem('exa_api_base') && !state.apiVerified) {
    applyApiServer();
  }

  // Event listeners
  const input = document.getElementById('message-input');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', autoResizeInput);
});

function parseJWT(token) {
  try { return JSON.parse(atob(token.split('.')[1])); } catch { return null; }
}

// ═══════════════════════════════════════════
//  Auth
// ═══════════════════════════════════════════
function handleLogin() {
  document.getElementById('login-loading').style.display = 'block';
  document.getElementById('login-error').style.display = 'none';
  const redirectUri = window.location.origin + window.location.pathname;
  fetch(apiUrl('/api/auth/start?redirect_uri=' + encodeURIComponent(redirectUri)))
    .then(r => r.json())
    .then(data => {
      if (data.auth_url) window.location.href = data.auth_url;
      else showLoginError('获取登录地址失败');
    })
    .catch(err => showLoginError('网络错误: ' + err.message));
}

function showLoginError(msg) {
  document.getElementById('login-loading').style.display = 'none';
  document.getElementById('login-error').style.display = 'block';
  document.getElementById('login-error').textContent = msg;
}

async function handleLogout() {
  localStorage.removeItem('exa_token');
  // Clear credentials on webui server
  try { await fetch('/_webui/token', { method: 'DELETE' }); } catch(e) {}
  state.token = null; state.user = null;
  state.chats = []; state.currentChatId = null; state.messages = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-name').textContent = state.user?.nickname || '未知用户';
  loadChats();
}

// ═══════════════════════════════════════════
//  API Helpers
// ═══════════════════════════════════════════
function apiHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` };
}

async function apiGet(url) {
  const res = await fetch(apiUrl(url), { headers: apiHeaders() });
  if (res.status === 401) { handleLogout(); throw new Error('Token 已过期'); }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function apiPost(url, body) {
  const res = await fetch(apiUrl(url), { method: 'POST', headers: apiHeaders(), body: JSON.stringify(body) });
  if (res.status === 401) { handleLogout(); throw new Error('Token 已过期'); }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function apiDelete(url) {
  const res = await fetch(apiUrl(url), { method: 'DELETE', headers: apiHeaders() });
  if (res.status === 401) { handleLogout(); throw new Error('Token 已过期'); }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ═══════════════════════════════════════════
//  Chat Management
// ═══════════════════════════════════════════
async function loadChats() {
  try { const data = await apiGet('/api/chat/list'); state.chats = data.chats || []; renderChats(); }
  catch (e) { toast('加载对话列表失败: ' + e.message, 'error'); }
}

function renderChats() {
  document.getElementById('chat-list').innerHTML = state.chats.map(c => `
    <div class="chat-item ${c.chat_id === state.currentChatId ? 'active' : ''}"
         onclick="selectChat(${c.chat_id})">
      <span class="chat-name">${esc(c.chat_name)}</span>
      <span class="chat-count">${c.message_count}</span>
      <button class="btn-del" onclick="event.stopPropagation();deleteChat(${c.chat_id})" title="删除">&times;</button>
    </div>
  `).join('');
}

function createNewChat(name) {
  const chatName = name || '新对话 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  state.pendingChatName = chatName; state.currentChatId = null; state.messages = [];
  document.getElementById('chat-title').textContent = chatName;
  document.getElementById('messages').innerHTML = `
    <div class="empty-chat" id="empty-chat">
      <div class="empty-icon">✨</div>
      <div class="empty-text">${esc(chatName)}</div>
      <div class="empty-hint">在下方输入消息开始对话</div>
    </div>`;
  focusInput();
}

async function selectChat(chatId) {
  state.currentChatId = chatId;
  document.getElementById('empty-chat')?.remove();
  try {
    const data = await apiGet(`/api/chat/${chatId}`);
    state.messages = data.messages || [];
    document.getElementById('chat-title').textContent = state.chats.find(c => c.chat_id === chatId)?.chat_name || '对话';
    renderMessages(); renderChats(); scrollToBottom();
    if (window.innerWidth <= 768) toggleSidebar(false);
  } catch (e) { toast('加载消息失败: ' + e.message, 'error'); }
}

async function deleteChat(chatId) {
  if (!confirm('确定要删除这个对话吗？此操作不可撤销。')) return;
  try {
    await apiDelete(`/api/chat/${chatId}`);
    state.chats = state.chats.filter(c => c.chat_id !== chatId);
    if (state.currentChatId === chatId) {
      state.currentChatId = null; state.messages = [];
      document.getElementById('chat-title').textContent = '选择一个对话';
      document.getElementById('messages').innerHTML = `
        <div class="empty-chat" id="empty-chat"><div class="empty-icon">✨</div><div class="empty-text">EXA AI Assistant</div><div class="empty-hint">在下方输入消息开始对话</div></div>`;
    }
    renderChats(); toast('对话已删除', 'success');
  } catch (e) { toast('删除失败: ' + e.message, 'error'); }
}

// ═══════════════════════════════════════════
//  Message Rendering (no avatars)
// ═══════════════════════════════════════════
function renderMessages() {
  document.getElementById('empty-chat')?.remove();
  document.getElementById('messages').innerHTML = state.messages
    .filter(m => m.role !== 'system')
    .map(m => m.role === 'user'
      ? `<div class="msg-row user"><div class="msg-bubble">${esc(m.content)}</div></div>`
      : `<div class="msg-row assistant"><div class="msg-content">${renderMarkdown(m.content)}</div></div>`
    ).join('');
}

function addUserMessage(content) {
  document.getElementById('empty-chat')?.remove();
  const div = document.createElement('div');
  div.className = 'msg-row user';
  div.innerHTML = `<div class="msg-bubble">${esc(content)}</div>`;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function addAssistantMessage(content) {
  document.getElementById('empty-chat')?.remove();
  removeTyping();
  const div = document.createElement('div');
  div.className = 'msg-row assistant';
  div.innerHTML = `<div class="msg-content">${renderMarkdown(content)}</div>`;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function showTyping() {
  document.getElementById('empty-chat')?.remove();
  const div = document.createElement('div');
  div.id = 'typing-indicator';
  div.className = 'msg-row assistant';
  div.innerHTML = '<div class="msg-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function removeTyping() { document.getElementById('typing-indicator')?.remove(); }

function addStatusTag(text) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg-row system';
  div.innerHTML = `<div class="msg-bubble status-tag">${text}</div>`;
  container.appendChild(div);
  scrollToBottom();
}

// ═══════════════════════════════════════════
//  Markdown
// ═══════════════════════════════════════════
function renderMarkdown(text) {
  if (typeof marked !== 'undefined') {
    try {
      marked.setOptions({ breaks: true, gfm: true });
      let html = marked.parse(text);
      if (typeof hljs !== 'undefined') {
        html = html.replace(/<pre><code class="language-(\w+)">([\s\S]*?)<\/code><\/pre>/g, (_, lang, code) => {
          try { return `<pre><code class="hljs language-${lang}">${hljs.highlight(code, { language: lang || 'plaintext' }).value}</code></pre>`; }
          catch { return `<pre><code>${esc(code)}</code></pre>`; }
        });
      }
      return html;
    } catch (e) { return simpleMd(text); }
  }
  return simpleMd(text);
}

function simpleMd(text) {
  let html = esc(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ═══════════════════════════════════════════
//  Send Message (SSE)
// ═══════════════════════════════════════════
async function sendMessage() {
  if (state.streaming) return;
  const input = document.getElementById('message-input');
  const message = input.value.trim();
  if (!message) return;

  state.streaming = true;
  input.value = ''; input.style.height = 'auto';
  document.getElementById('btn-send').disabled = true;

  addUserMessage(message);
  showTyping();

  try {
    const body = { message, tts_enabled: state.ttsEnabled };
    if (state.currentChatId) body.chat_id = state.currentChatId;
    else if (state.pendingChatName) body.chat_name = state.pendingChatName;
    if (state.modelType) body.model_type = state.modelType;

    const res = await fetch(apiUrl('/api/chat/stream_send'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
      body: JSON.stringify(body)
    });

    if (res.status === 401) { handleLogout(); return; }
    if (!res.ok) { removeTyping(); addAssistantMessage('❌ 请求失败 (HTTP ' + res.status + ')'); toast('请求失败', 'error'); return; }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', replyText = '', audioBase64 = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const ev = JSON.parse(line.slice(6));
            handleSSEEvent(ev);
            if (ev.status === 'text_ready') {
              replyText = ev.reply;
              if (ev.chat_id) { state.currentChatId = ev.chat_id; state.pendingChatName = null; }
            }
            if (ev.status === 'completed' && ev.audio) audioBase64 = ev.audio;
          } catch (e) {}
        }
      }
    }

    if (!state.currentChatId || !state.chats.find(c => c.chat_id === state.currentChatId)) {
      await loadChats();
      if (replyText && state.chats[0]) state.currentChatId = state.chats[0].chat_id;
    }

    if (state.currentChatId) {
      try {
        const data = await apiGet(`/api/chat/${state.currentChatId}`);
        state.messages = data.messages || [];
        renderMessages(); renderChats();
        const chat = state.chats.find(c => c.chat_id === state.currentChatId);
        if (chat) document.getElementById('chat-title').textContent = chat.chat_name;
        scrollToBottom();
      } catch (e) {}
    }

    if (audioBase64 && state.ttsEnabled) playAudioFromBase64(audioBase64);

  } catch (e) {
    removeTyping(); addAssistantMessage('❌ 网络错误: ' + e.message); toast(e.message, 'error');
  } finally {
    state.streaming = false;
    document.getElementById('btn-send').disabled = false;
    focusInput();
  }
}

function handleSSEEvent(ev) {
  removeTyping();
  switch (ev.status) {
    case 'parsing': addStatusTag('⏳ 正在解析请求...'); break;
    case 'request': addStatusTag('🚀 正在调用 AI 模型...'); break;
    case 'text_ready':
      if (ev.reply && !ev.filtered) addAssistantMessage(ev.reply);
      break;
    case 'execution': addStatusTag('⚡ 正在执行任务...'); break;
    case 'tts': addStatusTag('🔊 正在合成语音...'); break;
    case 'completed':
      if (ev.tts_error) addStatusTag('⚠ TTS 错误: ' + ev.tts_error);
      break;
  }
}

// ═══════════════════════════════════════════
//  Audio
// ═══════════════════════════════════════════
function playAudioFromBase64(b64) {
  try {
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
    const audio = new Audio(url);
    audio.onended = () => URL.revokeObjectURL(url);
    audio.play().catch(() => {});
  } catch (e) {}
}

// ═══════════════════════════════════════════
//  Voice Recording
// ═══════════════════════════════════════════
async function toggleRecording() {
  if (state.recording) { stopRecording(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.recording = true; state.audioChunks = [];
    const btn = document.getElementById('btn-mic');
    btn.classList.add('recording'); btn.textContent = '⏹';

    state.mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    state.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) state.audioChunks.push(e.data); };
    state.mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove('recording'); btn.textContent = '🎤';
      state.recording = false;
      if (state.audioChunks.length === 0) return;
      await sendAudioForASR(new Blob(state.audioChunks, { type: 'audio/webm' }));
    };
    state.mediaRecorder.start();
  } catch (e) { toast('麦克风访问失败: ' + e.message, 'error'); }
}

function stopRecording() { if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') state.mediaRecorder.stop(); }

async function sendAudioForASR(blob) {
  addStatusTag('🎤 正在识别语音...');
  try {
    const formData = new FormData();
    formData.append('audio', blob, 'recording.webm');
    const res = await fetch(apiUrl('/api/asr/recognize'), { method: 'POST', headers: { 'Authorization': `Bearer ${state.token}` }, body: formData });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.text) { document.getElementById('message-input').value = data.text; autoResizeInput(); }
    else toast('未识别到语音内容', 'info');
  } catch (e) { toast('语音识别失败: ' + e.message, 'error'); }
  document.querySelectorAll('.status-tag').forEach(t => { if (t.textContent.includes('识别语音')) t.parentElement?.remove(); });
}

// ═══════════════════════════════════════════
//  Settings
// ═══════════════════════════════════════════
function toggleTTS() {
  state.ttsEnabled = !state.ttsEnabled;
  document.getElementById('btn-tts').classList.toggle('active', state.ttsEnabled);
  document.getElementById('btn-tts').title = state.ttsEnabled ? '语音播报: 开' : '语音播报: 关';
}

function onModelChange(value) {
  state.modelType = value || null;
  const badge = document.getElementById('model-badge');
  if (value === 'fast') {
    badge.textContent = 'LMStudio';
    badge.style.cssText = 'color:var(--success);background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.2)';
  } else {
    badge.textContent = 'DeepSeek';
    badge.style.cssText = 'color:var(--cyan);background:rgba(6,182,212,0.1);border-color:rgba(6,182,212,0.2)';
  }
}

// ═══════════════════════════════════════════
//  UI Helpers
// ═══════════════════════════════════════════
function scrollToBottom() { const c = document.getElementById('messages'); setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50); }
function focusInput() { document.getElementById('message-input').focus(); }
function autoResizeInput() { const i = document.getElementById('message-input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 160) + 'px'; }

function toggleSidebar(force) {
  const open = force !== undefined ? force : !state.sidebarOpen;
  state.sidebarOpen = open;
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('sidebar-overlay').classList.toggle('open', open);
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3500);
}

window.addEventListener('resize', () => { if (window.innerWidth > 768 && state.sidebarOpen) toggleSidebar(false); });

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSN-exp Web Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #0d1117; --sidebar: #161b22; --card: #1c2128; --border: #30363d; --text: #c9d1d9; --text-dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; --cyan: #39d2c0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; font-size: 14px; line-height: 1.5; }
.sidebar { width: 220px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 16px 0; flex-shrink: 0; overflow-y: auto; }
.sidebar h2 { font-size: 16px; padding: 0 16px 16px; color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.sidebar a { display: block; padding: 8px 16px; color: var(--text-dim); text-decoration: none; font-size: 13px; transition: .15s; border-left: 3px solid transparent; }
.sidebar a:hover, .sidebar a.active { color: var(--text); background: rgba(88,166,255,.08); border-left-color: var(--accent); }
.main { flex: 1; padding: 20px 28px; overflow-y: auto; max-height: 100vh; }
.main h1 { font-size: 22px; margin-bottom: 16px; color: var(--accent); }
.main h2 { font-size: 16px; margin: 20px 0 10px; color: var(--text); }
.main h3 { font-size: 14px; margin: 16px 0 8px; color: var(--text-dim); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
.stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-card .label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; }
tr:hover td { background: rgba(88,166,255,.04); }
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; transition: .15s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
.btn-primary:hover { background: #2ea043; }
.btn-danger { background: #da3633; border-color: #f85149; color: #fff; }
.btn-danger:hover { background: #f85149; }
.btn-sm { padding: 3px 10px; font-size: 12px; }
input, select, textarea { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 13px; width: 100%; max-width: 400px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; }
pre, code { font-family: 'SFMono-Regular', Consolas, monospace; }
pre { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-green { background: rgba(63,185,80,.15); color: var(--green); }
.badge-red { background: rgba(248,81,73,.15); color: var(--red); }
.badge-yellow { background: rgba(210,153,34,.15); color: var(--yellow); }
.badge-cyan { background: rgba(57,210,192,.15); color: var(--cyan); }
.badge-gray { background: rgba(139,148,158,.15); color: var(--text-dim); }
.flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.mt-16 { margin-top: 16px; }
.gap-4 { gap: 4px; }
.hidden { display: none !important; }
.loading { opacity: .5; pointer-events: none; }
.toast { position: fixed; top: 16px; right: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; z-index: 999; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: slideIn .2s ease; }
.toast-error { border-color: var(--red); }
.toast-success { border-color: var(--green); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-bar button { padding: 8px 16px; background: none; border: none; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; font-size: 13px; }
.tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-bar button:hover { color: var(--text); }
@media (max-width: 768px) { .sidebar { width: 56px; } .sidebar h2, .sidebar a span { display: none; } .main { padding: 12px; } }
/* ── Check-in 打卡日历 ── */
.checkin-banner { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
.checkin-streak { background: linear-gradient(135deg,#1f6feb,#58a6ff); border-radius: 12px; padding: 22px 30px; text-align: center; color:#fff; min-width: 200px; }
.checkin-streak .days { font-size: 56px; font-weight: 800; line-height: 1; }
.checkin-streak .lbl { font-size: 14px; opacity: .9; margin-top: 6px; }
.checkin-stats { display: flex; gap: 12px; }
.checkin-stat { background: var(--card); border:1px solid var(--border); border-radius: 10px; padding: 14px 22px; text-align:center; }
.checkin-stat .n { font-size: 26px; font-weight:700; color:var(--accent); }
.checkin-stat .l { font-size:12px; color:var(--text-dim); }
.calendar-wrap { background: var(--card); border:1px solid var(--border); border-radius: 10px; padding: 16px; }
.calendar-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:13px; color:var(--text-dim); border:1px solid transparent; cursor:default; }
.cal-day.empty { border:none; }
.cal-day.checked { background:rgba(63,185,80,.18); color:var(--green); border-color:var(--green); font-weight:700; cursor:pointer; }
.cal-day.checked:hover { background:rgba(63,185,80,.32); }
.cal-day.today { border-color:var(--accent); }
.cal-dow { text-align:center; color:var(--text-dim); font-size:11px; font-weight:600; padding-bottom:6px; }
.checkin-day-list { margin-top:16px; }
.checkin-day-list .day-item { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px; cursor:pointer; }
.checkin-day-list .day-item:hover { border-color:var(--accent); }
.checkin-day-list .day-item .d { font-weight:700; color:var(--accent); }
.checkin-day-list .day-item .m { color:var(--text-dim); font-size:12px; }
.video-thumb { width: 100%; border-radius: 6px; }
@media (max-width: 768px) { .checkin-streak { min-width: 140px; } }
</style>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <h2>DSN Admin</h2>
  <a href="#" data-page="dashboard" class="active"><span>仪表盘</span></a>
  <a href="#" data-page="users"><span>用户管理</span></a>
  <a href="#" data-page="pairing"><span>配对码</span></a>
  <a href="#" data-page="plugins"><span>插件管理</span></a>
  <a href="#" data-page="memory"><span>记忆系统</span></a>
  <a href="#" data-page="config"><span>配置管理</span></a>
  <a href="#" data-page="persona"><span>人格系统</span></a>
  <a href="#" data-page="reminders"><span>提醒任务</span></a>
  <a href="#" data-page="hibernate"><span>待机维护</span></a>
  <a href="#" data-page="agent"><span>Agent</span></a>
  <a href="#" data-page="plans"><span>计划管理</span></a>
  <a href="#" data-page="logs"><span>日志</span></a>
  <a href="#" data-page="prompt"><span>系统提示词</span></a>
  <a href="#" data-page="tools"><span>工具箱</span></a>
  <a href="#" data-page="checkin"><span>打卡日历</span></a>
  <a href="#" data-page="system"><span>系统控制</span></a>
</nav>
<div class="main" id="main-content">
  <div id="page-dashboard"></div>
  <div id="page-users" class="hidden"></div>
  <div id="page-pairing" class="hidden"></div>
  <div id="page-plugins" class="hidden"></div>
  <div id="page-memory" class="hidden"></div>
  <div id="page-config" class="hidden"></div>
  <div id="page-persona" class="hidden"></div>
  <div id="page-reminders" class="hidden"></div>
  <div id="page-hibernate" class="hidden"></div>
  <div id="page-agent" class="hidden"></div>
  <div id="page-plans" class="hidden"></div>
  <div id="page-logs" class="hidden"></div>
  <div id="page-prompt" class="hidden"></div>
  <div id="page-tools" class="hidden"></div>
  <div id="page-checkin" class="hidden"></div>
  <div id="page-system" class="hidden"></div>
</div>
<div id="toast-container"></div>

<script>
const API_BASE = '/api/admin';
let TOKEN = localStorage.getItem('admin_token') || '';

function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (TOKEN) headers['X-Admin-Token'] = TOKEN;
  return fetch(API_BASE + path, { ...opts, headers })
    .then(r => r.json().catch(() => ({ error: r.statusText })))
    .then(data => {
      if (data.error === 'Unauthorized' && !window._authing) {
        const pw = prompt('Enter admin password:');
        if (pw) { TOKEN = pw; localStorage.setItem('admin_token', pw); return api(path, opts); }
      }
      return data;
    });
}

function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function showPage(name) {
  document.querySelectorAll('#main-content > div').forEach(d => d.classList.add('hidden'));
  const el = document.getElementById('page-' + name);
  if (el) el.classList.remove('hidden');
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  const link = document.querySelector(`.sidebar a[data-page="${name}"]`);
  if (link) link.classList.add('active');
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function badge(status) {
  const map = { active:'green', enabled:'green', pending:'yellow', running:'cyan', done:'green', cancelled:'red', skipped:'gray', completed:'green', failed:'red', maint:'red', standby:'gray', fixed:'cyan', predictive:'yellow' };
  const cls = map[status] || 'gray';
  return `<span class="badge badge-${cls}">${escapeHtml(status)}</span>`;
}

// ── Sidebar navigation ──
document.querySelectorAll('.sidebar a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    showPage(a.dataset.page);
    const fn = pageHandlers[a.dataset.page];
    if (fn) fn();
  });
});

const pageHandlers = {};

// ═══════════════════════════════════════
// Dashboard
// ═══════════════════════════════════════
pageHandlers.dashboard = function() {
  const el = document.getElementById('page-dashboard');
  el.innerHTML = '<h1>仪表盘</h1><div class="loading">Loading...</div>';
  api('/status').then(d => {
    const uptime = d.uptime ? Math.floor(d.uptime) + 's' : '-';
    const u = d.uptime;
    let uptimeStr = '-';
    if (u) {
      const parts = [];
      const days = Math.floor(u/86400); if(days) parts.push(days+'d');
      const hrs = Math.floor((u%86400)/3600); if(hrs) parts.push(hrs+'h');
      const mins = Math.floor((u%3600)/60); if(mins) parts.push(mins+'m');
      parts.push(Math.floor(u%60)+'s');
      uptimeStr = parts.join(' ');
    }
    el.innerHTML = `
      <h1>仪表盘</h1>
      <div class="stat-grid">
        <div class="stat-card"><div class="num">${d.users ? d.users.length : 0}</div><div class="label">用户</div></div>
        <div class="stat-card"><div class="num">${uptimeStr}</div><div class="label">运行时间</div></div>
        <div class="stat-card"><div class="num">${d.stats?.chats ?? '-'}</div><div class="label">聊天</div></div>
        <div class="stat-card"><div class="num">${d.stats?.messages ?? '-'}</div><div class="label">消息</div></div>
        <div class="stat-card"><div class="num">${d.stats?.active_sessions ?? '-'}</div><div class="label">活跃会话</div></div>
        <div class="stat-card"><div class="num">${d.config_count ?? '-'}</div><div class="label">配置项</div></div>
      </div>
      <div class="card">
        <h2>用户列表</h2>
        <table><thead><tr><th>UID</th><th>显示名</th><th>管理员</th></tr></thead><tbody>
        ${(d.users || []).map(u => `<tr><td>${u.uid}</td><td>${escapeHtml(u.display_name)}</td><td>${u.is_admin ? 'Y' : ''}</td></tr>`).join('')}
        </tbody></table>
      </div>`;
  });
};

// ═══════════════════════════════════════
// Users
// ═══════════════════════════════════════
pageHandlers.users = function() {
  const el = document.getElementById('page-users');
  el.innerHTML = '<h1>用户管理</h1><div class="loading">Loading...</div>';
  api('/users').then(d => {
    el.innerHTML = `
      <h1>用户管理</h1>
      <div class="card">
        <table><thead><tr><th>UID</th><th>显示名</th><th>管理员</th><th>注册时间</th></tr></thead><tbody>
        ${(d.users || []).map(u => `<tr>
          <td>${u.uid}</td><td>${escapeHtml(u.display_name)}</td>
          <td>${u.is_admin ? badge('enabled') : ''}</td>
          <td style="color:var(--text-dim)">${escapeHtml(u.created_at || '-')}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>`;
  });
};

// ═══════════════════════════════════════
// Pairing
// ═══════════════════════════════════════
pageHandlers.pairing = function() {
  const el = document.getElementById('page-pairing');
  api('/pairing/status').then(s => {
    el.innerHTML = `
      <h1>配对码</h1>
      <div class="card">
        <div class="flex-between mb-16">
          <span>当前状态: ${s.active ? badge('active') + ' 有未使用的配对码' : badge('gray') + ' 无活跃配对码'}</span>
          <button class="btn btn-primary" onclick="generatePairing()">生成新配对码</button>
        </div>
        <div id="pairing-result"></div>
      </div>`;
  });
};

window.generatePairing = function() {
  api('/pairing/generate', { method: 'POST' }).then(d => {
    if (d.success) {
      document.getElementById('pairing-result').innerHTML = `
        <div style="background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:20px;text-align:center">
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">新配对码</div>
          <div style="font-size:36px;font-weight:700;color:var(--accent);letter-spacing:6px;font-family:monospace">${escapeHtml(d.code || '')}</div>
        </div>`;
      toast('配对码已生成');
      pageHandlers.pairing();
    } else {
      toast(d.error || '生成失败', 'error');
    }
  });
};

// ═══════════════════════════════════════
// Plugins
// ═══════════════════════════════════════
pageHandlers.plugins = function() {
  const el = document.getElementById('page-plugins');
  el.innerHTML = '<h1>插件管理</h1><div class="loading">Loading...</div>';
  api('/plugins').then(d => {
    el.innerHTML = `
      <h1>插件管理</h1>
      <div class="card">
        <table><thead><tr><th>名称</th><th>启用</th><th>优先级</th><th>钩子</th><th>版本</th></tr></thead><tbody>
        ${(d.plugins || []).map(p => `<tr>
          <td><strong>${escapeHtml(p.name)}</strong></td>
          <td>${p.enabled ? badge('enabled') : badge('gray')}</td>
          <td>${p.priority}</td>
          <td style="color:var(--text-dim)">${escapeHtml((p.hooks || []).join(', '))}</td>
          <td>${escapeHtml(p.version)}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>`;
  });
};

// ═══════════════════════════════════════
// Memory
// ═══════════════════════════════════════
pageHandlers.memory = function() {
  const el = document.getElementById('page-memory');
  el.innerHTML = '<h1>记忆系统</h1><div class="loading">Loading...</div>';
  api('/memory/users').then(d => {
    el.innerHTML = `
      <h1>记忆系统</h1>
      <div style="margin-bottom:12px" class="flex">
        <button class="btn btn-primary btn-sm" onclick="memReindex()">重建向量索引</button>
      </div>
      <h2>用户记忆统计</h2>
      <div class="card">
        <table><thead><tr><th>UID</th><th>显示名</th><th>聊天数</th><th>记忆数</th><th>操作</th></tr></thead><tbody>
        ${(d.users || []).map(u => `<tr>
          <td>${u.uid}</td><td>${escapeHtml(u.display_name)}</td>
          <td>${u.chats}</td><td>${u.memories}</td>
          <td><button class="btn btn-sm" onclick="memChats(${u.uid})">查看聊天</button></td>
        </tr>`).join('')}
        </tbody></table>
      </div>
      <div id="memory-chats"></div>
      <div id="memory-entries"></div>`;
  });
};

window.memChats = function(uid) {
  api('/memory/chats/' + uid).then(d => {
    document.getElementById('memory-chats').innerHTML = `
      <h2>聊天列表 (UID=${uid})</h2>
      <div class="card"><table><thead><tr><th>ID</th><th>名称</th><th>消息</th><th>记忆</th><th>操作</th></tr></thead><tbody>
      ${(d.chats || []).map(c => `<tr>
        <td>${c.chat_id}</td><td>${escapeHtml(c.chat_name)}</td>
        <td>${c.message_count}</td><td>${c.memory_count}</td>
        <td><button class="btn btn-sm" onclick="memList(${uid},${c.chat_id})">查看记忆</button></td>
      </tr>`).join('')}
      </tbody></table></div>`;
  });
};

window.memList = function(uid, cid) {
  api('/memory/list/' + uid + '/' + cid).then(d => {
    document.getElementById('memory-entries').innerHTML = `
      <h2>记忆条目 (UID=${uid}, Chat=${cid})</h2>
      <div class="card">
        ${(d.entries || []).length === 0 ? '<p style="color:var(--text-dim)">无记忆</p>' : `
        <table><thead><tr><th>ID</th><th>轮次</th><th>摘要</th><th>类型</th><th>时间</th></tr></thead><tbody>
        ${(d.entries || []).map(e => `<tr>
          <td>${e.id}</td><td>${e.round ?? '-'}</td>
          <td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(e.content || '').slice(0,80)}</td>
          <td>${escapeHtml(e.type)}</td>
          <td style="color:var(--text-dim)">${escapeHtml((e.created_at||'').slice(0,19))}</td>
        </tr>`).join('')}
        </tbody></table>`}
      </div>`;
  });
};

window.memReindex = function() {
  api('/memory/reindex', { method: 'POST' }).then(d => {
    if (d.success) toast('索引重建已启动');
    else toast(d.error || '失败', 'error');
  });
};

// ═══════════════════════════════════════
// Config
// ═══════════════════════════════════════
pageHandlers.config = function() {
  const el = document.getElementById('page-config');
  el.innerHTML = '<h1>配置管理</h1><div class="loading">Loading...</div>';
  api('/config').then(d => {
    let rows = (d.configs || []).map(c => `<tr>
      <td style="font-family:monospace;font-size:12px">${escapeHtml(c.key)}</td>
      <td>${escapeHtml(c.value)}</td>
      <td>${c.sensitive ? badge('red')+' 敏感' : ''} ${c.readonly ? badge('yellow')+' 只读' : ''}</td>
      <td>${c.readonly ? '—' : `<button class="btn btn-sm" onclick="editConfig('${escapeHtml(c.key)}','${escapeHtml(c.raw_value || c.value)}')">修改</button>`}</td>
    </tr>`).join('');
    el.innerHTML = `
      <h1>配置管理</h1>
      <div class="flex-between mb-16">
        <span>备份数: ${d.backups ?? 0} <button class="btn btn-sm" onclick="undoConfig()" ${!d.backups ? 'disabled' : ''}>回退</button></span>
      </div>
      <div class="card" style="overflow-x:auto">
        <table><thead><tr><th>配置项</th><th>值</th><th>属性</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
      <div id="config-edit-area"></div>`;
  });
};

window.editConfig = function(key, val) {
  document.getElementById('config-edit-area').innerHTML = `
    <div class="card">
      <h3>修改配置: ${escapeHtml(key)}</h3>
      <div class="flex" style="margin-top:8px">
        <input id="config-val-input" value="${escapeHtml(val)}" style="max-width:300px">
        <button class="btn btn-primary btn-sm" onclick="saveConfig('${escapeHtml(key)}')">保存</button>
        <button class="btn btn-sm" onclick="document.getElementById('config-edit-area').innerHTML=''">取消</button>
      </div>
    </div>`;
};

window.saveConfig = function(key) {
  const val = document.getElementById('config-val-input').value;

          <td class="flex gap-4">
            <button class="btn btn-sm ${r.status === 'pending' ? 'btn-danger' : ''}" onclick="remCancel('${escapeHtml(r.task_id)}')">取消</button>

          </td>

        </tbody></table>`}

function fmtInterval(s) {
  if (s >= 86400) return (s/86400)+'d';
  if (s >= 3600) return (s/3600)+'h';
  if (s >= 60) return (s/60)+'m';
  return s+'s';
}

// ═══════════════════════════════════════
// Check-in 打卡日历
// ═══════════════════════════════════════
let _checkinUsers = [];
let _checkinUid = 0;
let _checkinY = new Date().getFullYear();
let _checkinM = new Date().getMonth() + 1;

function videoUrl(path) {
  // <video> 标签不带自定义头，token 走 query
  const sep = path.includes('?') ? '&' : '?';
  return '/api/admin/checkin/video' + sep + 'path=' + encodeURIComponent(path) + '&admin_token=' + encodeURIComponent(TOKEN);
}

function renderCalendar(d) {
  const el = document.getElementById('page-checkin');
  const checkedSet = {};
  (d.days || []).forEach(day => {
    const date = new Date(day.date + 'T00:00:00');
    checkedSet[date.getDate()] = day;
  });
  const first = new Date(_checkinY, _checkinM - 1, 1);
  const daysInMonth = new Date(_checkinY, _checkinM, 0).getDate();
  const firstDow = first.getDay(); // 0=Sun
  const dow = ['日','一','二','三','四','五','六'];
  const today = new Date();
  let cells = '';
  for (let i = 0; i < firstDow; i++) cells += '<div class="cal-day empty"></div>';
  for (let dnum = 1; dnum <= daysInMonth; dnum++) {
    const isChecked = checkedSet[dnum];
    const isToday = (today.getFullYear() === _checkinY && today.getMonth() + 1 === _checkinM && today.getDate() === dnum);
    const cls = ['cal-day'];
    if (isChecked) cls.push('checked');
    if (isToday) cls.push('today');
    cells += `<div class="${cls.join(' ')}" ${isChecked ? `onclick="showDayVideos(${dnum})"` : ''}>${dnum}</div>`;
  }
  const streak = d.streak || 0;
  el.innerHTML = `
    <h1>打卡日历</h1>
    <div class="card">
      <div class="flex-between">
        <span>用户:</span>
        <select id="checkin-user" onchange="checkinChangeUser(this.value)">
          ${_checkinUsers.map(u => `<option value="${u.uid}">${escapeHtml(u.display_name || u.uid)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="checkin-banner">
      <div class="checkin-streak">
        <div class="days">${streak}</div>
        <div class="lbl">连续打卡天数</div>
      </div>
      <div class="checkin-stats">
        <div class="checkin-stat"><div class="n">${d.total_days || 0}</div><div class="l">累计打卡天数</div></div>
        <div class="checkin-stat"><div class="n">${d.today_checked ? '✓' : '—'}</div><div class="l">今日已打卡</div></div>
        <div class="checkin-stat"><div class="n">${d.today_checkin_time || ''}</div><div class="l">今日打卡时间</div></div>
      </div>
    </div>
    <div class="calendar-wrap">
      <div class="calendar-head">
        <button class="btn" onclick="checkinMonth(-1)">‹ 上月</button>
        <h2>${_checkinY} 年 ${_checkinM} 月</h2>
        <button class="btn" onclick="checkinMonth(1)">下月 ›</button>
      </div>
      <div class="calendar-grid">
        ${dow.map(w => `<div class="cal-dow">${w}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div id="checkin-day-detail"></div>`;
}

window.showDayVideos = function(dayNum) {
  const container = document.getElementById('checkin-day-detail');
  container.innerHTML = '<div class="loading">Loading...</div>';
  const dateStr = `${_checkinY}-${String(_checkinM).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
  api(`/checkin/calendar?uid=${_checkinUid}&year=${_checkinY}&month=${_checkinM}`).then(d => {
    const day = (d.days || []).find(x => x.date === dateStr);
    if (!day || !day.checkins.length) {
      container.innerHTML = `<div class="card"><p>该日无打卡记录</p></div>`;
      return;
    }
    container.innerHTML = `
      <h2>${dateStr} 打卡记录</h2>
      ${day.checkins.map(c => {
        const vid = c.video_path || c.media_path;
        return `
          <div class="card">
            <div class="flex-between">
              <span><b>${c.checkin_time}</b> ${c.is_valid ? ' <span class="badge badge-green">有效</span>' : ' <span class="badge badge-gray">附加</span>'}</span>
              <button class="btn btn-sm" onclick="playCheckinVideo('${escapeHtml(vid)}')">播放视频</button>
            </div>
            ${c.text ? `<p style="color:var(--text-dim);margin-top:6px">${escapeHtml(c.text)}</p>` : ''}
          </div>`;
      }).join('')}
      <div id="video-player"></div>`;
  });
};

window.playCheckinVideo = function(path) {
  const player = document.getElementById('video-player');
  if (!path) { player.innerHTML = '<p>无视频文件</p>'; return; }
  player.innerHTML = `<video controls autoplay style="width:100%;max-width:720px;border-radius:8px" src="${videoUrl(path)}"></video>`;
};

window.checkinMonth = function(delta) {
  _checkinM += delta;
  if (_checkinM > 12) { _checkinM = 1; _checkinY++; }
  if (_checkinM < 1) { _checkinM = 12; _checkinY--; }
  loadCheckin();
};

window.checkinChangeUser = function(uid) {
  _checkinUid = parseInt(uid) || 0;
  loadCheckin();
};

function loadCheckin() {
  const el = document.getElementById('page-checkin');
  if (!_checkinUid) {
    el.innerHTML = '<h1>打卡日历</h1><div class="loading">请选择用户...</div>';
    return;
  }
  el.innerHTML = '<h1>打卡日历</h1><div class="loading">Loading...</div>';
  api(`/checkin/calendar?uid=${_checkinUid}&year=${_checkinY}&month=${_checkinM}`).then(d => {
    if (d.error) { el.innerHTML = `<h1>打卡日历</h1><p style="color:var(--red)">${escapeHtml(d.error)}</p>`; return; }
    renderCalendar(d);
  });
}

pageHandlers.checkin = function() {
  const el = document.getElementById('page-checkin');
  el.innerHTML = '<h1>打卡日历</h1><div class="loading">Loading...</div>';
  api('/users').then(users => {
    _checkinUsers = users.users || [];
    if (_checkinUsers.length) {
      _checkinUid = _checkinUsers[0].uid;
      loadCheckin();
    } else {
      el.innerHTML = '<h1>打卡日历</h1><p>暂无用户</p>';
    }
  });
};

// ── Init ──
showPage('dashboard');
pageHandlers.dashboard();
</script>
</body>
</html>

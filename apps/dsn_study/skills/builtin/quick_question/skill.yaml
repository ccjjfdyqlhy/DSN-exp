name: quick_question
display_name: "快捷录入题目"
description: "用完整字段一次录入一道题目，支持选择题选项、解析、知识点标签。适合逐题录入或补充单道题目。"
version: "1.0.0"
author: "system"
source: "builtin"
enabled: true
status: "active"
prompt_category: "skills"
prompt_priority: 71

tools:
  - name: add_question
    display_name: "录入单题"
    description: "录入一道完整题目，支持所有字段（含选择题选项、解析、知识点）。适合逐题精确录入。"
    module: "tools.quick_question"
    class: "QuickQuestionTool"
    methods:
      - name: add_question
        description: "创建一道题目并存入题库"
        parameters:
          subject:
            type: string
            description: "学科代码 (math/physics/chemistry/english/chinese/biology/politics/history/geography)"
            required: true
          content:
            type: string
            description: "题目内容"
            required: true
          answer:
            type: string
            description: "参考答案"
            required: true
          type_name:
            type: string
            description: "题型 (选择题/填空题/解答题/判断题)"
            default: "解答题"
          subtype:
            type: string
            description: "子题型 (单选/多选/填空/计算/证明/简答/判断)"
            default: ""
          difficulty:
            type: integer
            description: "难度 1-5，默认 3"
            default: 3
          options:
            type: array
            description: "选择题选项列表，如 [\"A. 选项一\", \"B. 选项二\"]"
            default: []
          explanation:
            type: string
            description: "题目解析/解题思路"
            default: ""
          knowledge_points:
            type: array
            description: "关联知识点列表，如 [\"牛顿第一定律\", \"受力分析\"]"
            default: []
          tags:
            type: array
            description: "标签列表，如 [\"月考\", \"期中\"]"
            default: []

activation:
  keywords: ["录入", "添加题目", "加一题", "创建题目", "quick_question"]
  auto_activate: false

dependencies:
  - question_store
  - template_manager
tags: [question, import, quick, single]

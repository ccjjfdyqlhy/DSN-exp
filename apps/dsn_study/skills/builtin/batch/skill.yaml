name: batch
display_name: "批量操作"
description: "一次性提交多个操作到后台线程池并行执行"
version: "1.0"
enabled: true
status: "active"
prompt_category: "skills"
prompt_priority: "70"
prompts: []
tools:
  - name: batch_execute
    display_name: "批量执行"
    description: "一次性提交多个操作到线程池并行执行（shell/python/write_file/edit_file）。提交后立即返回所有 task_id，不阻塞对话。"
    module: "tools.batch_tools"
    class: "BatchTools"
    methods:
      - name: batch_execute
        description: "批量提交操作到线程池"
        parameters:
          actions:
            type: array
            description: "操作列表，每个元素含 action_type / content，以及可选的 file_path / overwrite / pattern / replacement / label"
            required: true
            items:
              type: object
              description: "单个操作对象"
  - name: batch_status
    display_name: "批量状态查询"
    description: "查询批量任务的执行状态与结果。"
    module: "tools.batch_tools"
    class: "BatchTools"
    methods:
      - name: batch_status
        description: "查询批量任务状态"
        parameters:
          task_ids:
            type: array
            description: "要查询的 task_id 列表"
            required: true
            items:
              type: string

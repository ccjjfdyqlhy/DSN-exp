name: text_extract
display_name: "文本提取题目"
description: "从自由文本（OCR 结果、粘贴的试卷文字等）中自动识别并提取题目。支持先预览再确认入库，避免误入库。"
version: "1.0.0"
author: "system"
source: "builtin"
enabled: true
status: "active"
prompt_category: "skills"
prompt_priority: 70

tools:
  - name: extract_preview
    display_name: "提取预览"
    description: "从文本中自动识别所有题目并返回结构化预览（不入库）。让用户确认识别结果后再决定是否入库。"
    module: "tools.text_extract"
    class: "TextExtractTool"
    methods:
      - name: extract_preview
        description: "从文本提取题目并返回预览"
        parameters:
          text:
            type: string
            description: "包含题目的文本内容（可以是 OCR 识别结果、粘贴的试卷文本等）"
            required: true
          subject:
            type: string
            description: "学科代码，用于辅助识别 (math/physics/chemistry/english/chinese/biology)"
            default: "math"

  - name: confirm_import
    display_name: "确认入库"
    description: "将 extract_preview 返回的题目确认后批量入库。必须先调用 extract_preview 再调此工具。"
    module: "tools.text_extract"
    class: "TextExtractTool"
    methods:
      - name: confirm_import
        description: "确认预览结果并将题目入库"
        parameters:
          questions:
            type: array
            description: "从 extract_preview 返回的 raw_questions 列表（直接传入 raw_questions 字段的值）"
            required: true
            items:
              type: object
          subject:
            type: string
            description: "学科代码"
            default: "math"

activation:
  keywords: ["提取题目", "文本提取", "识别题目", "录入文本", "text_extract", "extract_preview"]
  auto_activate: false

dependencies:
  - question_store
  - template_manager
  - models_plugin
tags: [question, import, text, extract, preview]

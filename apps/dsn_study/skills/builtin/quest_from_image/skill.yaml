name: quest_from_image
display_name: "图片识题"
description: "通过视觉模型从题目截图或照片中识别题目内容，自动提取并入库。支持单张或批量图片。"
version: "1.0.0"
author: "system"
source: "builtin"
enabled: true
status: "active"
prompt_category: "skills"
prompt_priority: 69

tools:
  - name: import_photo_questions
    display_name: "图片直接入库"
    description: "【拍题/截图入库专用·一键完成】从一张题目图片直接导入题库，视觉模型自动识别科目+题目原文+答案+解析并入库，一步到位。"
    module: "tools.quest_from_image"
    class: "QuestFromImageTool"
    methods:
      - name: import_photo_questions
        description: "从单张图片识别题目并直接入库（科目由视觉模型自动识别）"
        parameters:
          file_path:
            type: string
            description: "图片文件路径（支持 ~ 展开），如 ~/Desktop/题目.png"
            required: true
          subject:
            type: string
            description: "学科代码，可留空；留空时由视觉模型从图片内容自动识别"
            required: false
          preview_only:
            type: boolean
            description: "true=仅预览识别结果不入库, false(默认)=识别后直接入库"
            default: false

  - name: import_photo_questions_batch
    display_name: "批量图片直接入库"
    description: "一次处理多张题目图片，每张由视觉模型自动识别科目和题目后合并入库。"
    module: "tools.quest_from_image"
    class: "QuestFromImageTool"
    methods:
      - name: import_photo_questions_batch
        description: "从多张图片批量识别题目并入库"
        parameters:
          file_paths:
            type: array
            description: "图片文件路径列表，如 [\"~/pic1.png\", \"~/pic2.png\"]"
            required: true
            items:
              type: string
          subject:
            type: string
            description: "学科代码，可留空；留空时由视觉模型自动识别"
            required: false
          preview_only:
            type: boolean
            description: "true=仅预览不入库"
            default: false

activation:
  keywords: ["图片", "截图", "照片", "识题", "拍题", "图片录入", "snap", "quest_from_image"]
  auto_activate: false

dependencies:
  - question_store
  - template_manager
tags: [question, import, image, vision, snap]

name: "高考6科"
description: "适用于高考的6科配置 (语数英+物化生)"
version: "1.0"
author: "system"

subjects:
  - code: "chinese"
    name: "语文"
    icon: "📖"
    question_types: ["选择题", "填空题", "阅读理解", "作文题"]
    typical_score: 150
    exam_duration: 150

  - code: "math"
    name: "数学"
    icon: "📐"
    question_types: ["选择题", "填空题", "解答题"]
    typical_score: 150
    exam_duration: 120

  - code: "english"
    name: "英语"
    icon: "🔤"
    question_types: ["选择题", "填空题", "阅读理解", "作文题"]
    typical_score: 150
    exam_duration: 120

  - code: "physics"
    name: "物理"
    icon: "⚡"
    question_types: ["选择题", "填空题", "解答题"]
    typical_score: 100
    exam_duration: 90

  - code: "chemistry"
    name: "化学"
    icon: "🧪"
    question_types: ["选择题", "填空题", "解答题"]
    typical_score: 100
    exam_duration: 90

  - code: "biology"
    name: "生物"
    icon: "🧬"
    question_types: ["选择题", "填空题", "解答题"]
    typical_score: 100
    exam_duration: 90

question_types:
  - name: "选择题"
    subtypes: ["单选", "多选"]
    scoring_mode: "exact"
  - name: "填空题"
    subtypes: ["填空"]
    scoring_mode: "keyword"
  - name: "解答题"
    subtypes: ["计算", "证明", "简答"]
    scoring_mode: "llm"
  - name: "判断题"
    subtypes: ["判断"]
    scoring_mode: "exact"
  - name: "作文题"
    subtypes: ["作文"]
    scoring_mode: "llm"
  - name: "阅读理解"
    subtypes: ["阅读"]
    scoring_mode: "llm"

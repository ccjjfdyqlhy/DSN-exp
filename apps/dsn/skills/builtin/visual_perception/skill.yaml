name: visual_perception
display_name: "视觉感知"
description: "通过摄像头观察周围环境，描述用户和场景状态"
version: "1.0"
author: "system"
source: "builtin"
enabled: true
status: "active"
prompt_category: "skills"
prompt_priority: 55

tools:
  - name: look_around
    display_name: "观察周围"
    description: "『睁开眼睛』— 通过摄像头拍摄当前画面，用视觉模型分析你看到了什么。返回结果中包含摄像头捕捉到的实时画面描述。你可以看到用户在做什么、环境光线、场景状态。每次调用都会获取最新的真实画面。"
    module: "tools.perception"
    class: "VisualPerceptionTool"
    methods:
      - name: look_around
        description: "观察周围环境并返回视觉描述"
        parameters:
          focus:
            type: string
            description: "关注焦点（可选）: 留空则全面描述；指定如 'user' 关注用户状态，'environment' 关注环境"
            required: false
          camera:
            type: string
            description: "目标摄像头逻辑名（可选，如 cam0 / cam1 / front；也可以是后端添加的远程摄像头逻辑名，如 door / webcam0）。首次调用时留空或填 'all' 会枚举所有摄像头（本地+远程）并逐台描述；之后可按逻辑名单独调用某台。用 list_cameras 可查看全部可用的摄像头及备注"
            required: false

  - name: set_camera_note
    display_name: "给摄像头写备注"
    description: "给指定摄像头写一条备注（说明它的位置/用途），便于后续识别。首次 look_around 拿到各摄像头描述后，用本工具给每台摄像头写备注。"
    module: "tools.perception"
    class: "VisualPerceptionTool"
    methods:
      - name: set_camera_note
        description: "给摄像头写备注"
        parameters:
          logical_name:
            type: string
            description: "摄像头逻辑名，如 cam0 / cam1"
            required: true
          note:
            type: string
            description: "备注内容，如 '对着桌面的主摄像头' / '对着门口的摄像头'"
            required: true

  - name: list_cameras
    display_name: "列出摄像头"
    description: "列出所有已登记摄像头及其备注。"
    module: "tools.perception"
    class: "VisualPerceptionTool"
    methods:
      - name: list_cameras
        description: "列出已登记摄像头及备注"
        parameters: {}

activation:
  keywords: ["看看", "看", "观察", "看到", "视觉", "摄像头", "周围", "环境", "你看到", "look"]
  auto_activate: false

dependencies: []
tags: [vision, camera, perception, environment]

# 把 docs/site/ 作为站点根发布到 GitHub Pages。
#
# 为什么不用分支式部署（Settings → Pages → Deploy from a branch）：
# 分支式部署的 source path 只接受 / 或 /docs，无法把 docs/site 单独作为站点根；
# 而 docs/ 下还放着一堆 .md 文档，不适合直接当站点根。
# Actions 部署支持任意子目录，是官方推荐的唯一解法。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      # 徽章上的测试数要跟着代码走：改了代码或测试，数字可能变，
      # 所以这两条路径也触发重建（只重建站点，不发布包）。
      # scripts/ 也要带上 —— 生成徽章 JSON 的脚本就在那儿。
      - 'aicf/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Count the tests (feeds the README badge)
        # 徽章上的「1288 passed」得是**这个 commit** 的数字，不能是抄来的。
        # 所以在发布站点前真跑一遍测试，把结果写成 shields.io 的 endpoint JSON。
        # 失败不阻断站点发布（站点是门面，不该被一个 flaky 测试卡住），
        # 但失败会如实显示成红色的「N failed」—— 不藏。
        continue-on-error: true
        run: |
          python -m pip install -U pip
          pip install -e ".[mcp,anthropic,socks]"
          pip install pytest pytest-asyncio
          python -m pytest -q tests/ -m "not known_broken and not fault and not mutation" > pytest.log 2>&1 || true
          python scripts/write_tests_badge.py pytest.log > docs/site/tests.json
          cat docs/site/tests.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

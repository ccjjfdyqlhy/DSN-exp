name: ci

on:
  push:
    branches: [main, "harness-refactor"]
  pull_request:
  # L4 故障注入层（策划案 §8.1 / §8.2）每夜跑一次：
  # 它会真的 kill -9 / SIGKILL 子进程，不适合每次提交都跑。
  # workflow_dispatch 让人能随时手动补跑一次。
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mcp,anthropic,socks]"
          pip install pytest pytest-asyncio

      - name: test
        # testpaths in pyproject.toml limits collection to tests/.
        run: python -m pytest -q tests/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build and check metadata
        run: |
          python -m pip install -U build twine
          python -m build
          twine check dist/*

  fault:
    # 故障注入层（策划案 §8.2 的 7 条必须存在的用例 / R7）。
    # 门禁是 nightly + 手动触发（见上面的 schedule）。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mcp,anthropic,socks]"
          pip install pytest pytest-asyncio

      - name: fault injection (kill -9 / duplicate delivery / corrupt checkpoint)
        run: python -m pytest -q tests/fault/

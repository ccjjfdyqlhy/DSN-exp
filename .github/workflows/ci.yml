name: ci

on:
  push:
    branches: [main, "harness-refactor"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mcp,anthropic,socks]"
          pip install pytest pytest-asyncio

      - name: test
        # testpaths in pyproject.toml limits collection to tests/.
        run: python -m pytest -q tests/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build and check metadata
        run: |
          python -m pip install -U build twine
          python -m build
          twine check dist/*

name: ci

on:
  push:
    branches: [main, "harness-refactor", "fix/**"]
  pull_request:
  # L4 故障注入层（策划案 §8.1 / §8.2）每夜跑一次：
  # 它会真的 kill -9 / SIGKILL 子进程，不适合每次提交都跑。
  # workflow_dispatch 让人能随时手动补跑一次。
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mcp,anthropic,socks]"
          pip install pytest pytest-asyncio

      - name: test
        # testpaths in pyproject.toml limits collection to tests/.
        # The fault and mutation layers are excluded here: they belong to
        # the nightly job below.
        run: >-
          python -m pytest -q tests/
          -m "not known_broken and not fault and not mutation"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build and check metadata
        run: |
          python -m pip install -U build twine
          python -m build
          twine check dist/*

  wheel-smoke:
    # 装出来的包必须真的能用。
    # 0.6.2 的教训：那版带着「装完没有 aicf 命令、没有随包数据集」的缺陷
    # 发布到了 PyPI，而源码树的测试全绿 —— 因为测的是源码，不是 wheel。
    # 这个作业构建 wheel、装进干净虚拟环境、按 README 的说法去用它。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the wheel
        run: |
          python -m pip install -U build
          rm -rf build dist
          python -m build
      - name: wheel smoke gate
        run: python scripts/wheel_smoke.py

  fault:
    # 故障注入层（策划案 §8.2 的 7 条必须存在的用例 / R7）。
    # 门禁是 nightly + 手动触发（见上面的 schedule）。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mcp,anthropic,socks]"
          pip install pytest pytest-asyncio

      - name: fault injection (kill -9 / duplicate delivery / corrupt checkpoint)
        run: python -m pytest -q tests/fault/ -m "not mutation"

      - name: mutation guards (remove a protection, expect the test to fail)
        # The mutation layer proves the test suite has teeth: it removes a
        # protection and expects the matching test to turn red.
        env:
          RUN_MUTATION: "1"
        run: python -m pytest -q tests/fault/mutation/

  contract:
    # L2 契约层（策划案 §8.1）：端口实现的一致性。
    # 换沙箱后端、换 store、换 evaluator 时，这一层必须先红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mcp,anthropic,socks]"
          pip install pytest pytest-asyncio
      - name: contract and dependency direction
        run: >-
          python -m pytest -q
          tests/test_rc0_contracts.py
          tests/test_rc0_dependency_direction.py

  eval:
    # L5 评测层（策划案 §8.1）：数据集 + 评估器 + 四闸门。
    # 这是「每次改动都能被评估」这条承诺的门禁。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mcp,anthropic,socks]"
          pip install pytest pytest-asyncio
      - name: dataset, evaluator and the four gates
        run: |
          python -m pytest -q tests/test_rc0_eval.py
          # 评测集里的工具名必须能落到真实注册表上。
          # 1.0.0 之前 basic.yaml 有 26 条断言指向不存在的工具，
          # 而 test_rc0_eval.py 抓不到 —— 因为它用数据集自己的抽象名造轨迹，
          # 再拿抽象名去比对，是循环论证。这条测试补上缺的那一半。
          python -m pytest -q tests/test_eval_dataset_bindings.py

      - name: the evaluation cli really runs (not just --help)
        run: |
          set -uo pipefail
          mkdir -p traces
          # 真跑一次：不是 --help —— 要真的把随包数据集读进来、打分、出报告，
          # 再把报告喂给闸门。1.0.0 之前这一步只跑 --help，
          # 于是「随包数据集能不能真的用」从来没被验证过。
          #
          # 退出码非 0 是预期的：离线桩模型不会调工具，数据集用例本来就过不了
          # （README「九十秒」里也是这么说的）。这里要验的是**链路通**，
          # 所以只放过「用例没过」，崩溃（Traceback）必须让 CI 变红。
          rc=0
          python -m aicf.harness.cli.main eval --dataset basic \
              --traces traces/ --out run.json > eval.log 2>&1 || rc=$?
          if grep -q "Traceback" eval.log; then cat eval.log; exit 1; fi
          echo "eval 退出码 $rc（用例未通过属预期）"
          cat eval.log | tail -5

          rc=0
          python -m aicf.harness.cli.main gate --run run.json --out gate.json > gate.log 2>&1 || rc=$?
          if grep -q "Traceback" gate.log; then cat gate.log; exit 1; fi
          echo "gate 退出码 $rc（闸门未通过属预期）"
          cat gate.log | tail -6

          # 链路通的判据：两个产物都在，且都覆盖了全部用例与四道闸门。
          python - <<'PY'
          import json

          run = json.load(open("run.json", encoding="utf-8"))
          gate = json.load(open("gate.json", encoding="utf-8"))

          total = int(run["aggregate"]["total_cases"])
          assert total == len(run["results"]), (total, len(run["results"]))
          assert total > 0, "评测集一条用例都没读到 —— 随包数据集没装上？"
          assert len(gate["outcomes"]) == 4, gate["outcomes"]
          assert {o["name"] for o in gate["outcomes"]} == {
              "quality", "regression", "cost", "safety"}, gate["outcomes"]
          print(f"eval/gate 链路 OK：{total} 条用例，4 道闸门")
          PY

# release flow: pushing a v* tag builds, tests and publishes to pypi.
#
# This uses pypi trusted publishing. Configure it once on pypi:
# owner=ccjjfdyqlhy, repository=aicf-core, workflow=release.yml,
# environment=pypi. After that, no token is needed.
#
# The repository was renamed from DSN-exp to aicf-core, so the pypi publisher
# must point at the current repository name or the upload returns 403.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install build and test tools
        run: python -m pip install -U build twine pytest pytest-asyncio

      - name: check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: install the package and run the test suite
        run: |
          python -m pip install -e ".[mcp,anthropic,socks]"
          python -m pytest -q tests/

      - name: build
        # 清掉陈旧产物：setuptools 会把 build/lib 里已有的东西一起打进 wheel，
        # 上一次重构前的 build/ 残留会让 wheel 里混进已删除的顶层包。
        run: |
          rm -rf build dist
          python -m build

      - name: check the metadata
        run: twine check dist/*

      - name: wheel smoke gate (the installed package must actually work)
        # 这一步是 0.6.2 的教训：那版**成功发布到了 PyPI**，但包里没有
        # console_scripts、没有随包数据集，README 上每条命令都是
        # command not found。源码树里的测试全绿也发现不了 —— 测的是源码，
        # 不是用户真正装到的那份字节。
        # 这里装进一个全新的虚拟环境，按 README 的说法去用它。
        run: python scripts/wheel_smoke.py

      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1

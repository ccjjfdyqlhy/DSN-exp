# aicf 发布流程 — 推送 v* 标签即构建、测试并发布到 PyPI。
#
# 依赖 PyPI 上的可信发布（trusted publishing）：仓库页 -> Settings ->
# Add a new pending publisher，填 owner=ccjjfdyqlhy、repository=aicf-core、
# workflow=release.yml、environment=pypi。首次配置后无需任何 token。
#
# ⚠️ 仓库已从 DSN-exp 改名为 aicf-core（2026-11-18 拆分），
#    **PyPI 上的 publisher 配置也要把 repository 改成 aicf-core**，否则发布会 403。

name: release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # trusted publishing（OIDC）必需

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install build and test tools
        run: python -m pip install -U build twine pytest

      - name: check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: install the package and run the smoke tests
        run: |
          python -m pip install -e ".[mcp,anthropic,socks]"
          # tests/test_version.py keeps pyproject, harness.__version__ and the
          # docs in step: the tag check above only compares against pyproject.
          python -m pytest tests/test_transcript_store.py tests/test_agent_engine.py \
            tests/test_orchestrator_gaps.py tests/test_harness_agent.py \
            tests/test_version.py -q

      - name: build
        run: python -m build

      - name: check the metadata
        run: twine check dist/*

      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1

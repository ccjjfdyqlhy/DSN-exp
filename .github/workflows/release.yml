# release flow: pushing a v* tag builds, tests and publishes to pypi.
#
# This uses pypi trusted publishing. Configure it once on pypi:
# owner=ccjjfdyqlhy, repository=aicf-core, workflow=release.yml,
# environment=pypi. After that, no token is needed.
#
# The repository was renamed from DSN-exp to aicf-core, so the pypi publisher
# must point at the current repository name or the upload returns 403.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install build and test tools
        run: python -m pip install -U build twine pytest pytest-asyncio

      - name: check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: install the package and run the test suite
        run: |
          python -m pip install -e ".[mcp,anthropic,socks]"
          python -m pytest -q tests/

      - name: build
        run: python -m build

      - name: check the metadata
        run: twine check dist/*

      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1

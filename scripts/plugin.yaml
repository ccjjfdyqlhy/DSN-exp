name: script
description: 剧本系统 — OOC 检测 + 剧本回放 + 进度记录
enabled: true
class: "scripts.plugin:ScriptPlugin"
hooks:
  - hook: PRE_FILTER
    priority: 10
  - hook: PRE_PROCESS
    priority: 10
  - hook: POST_PROCESS
    priority: 10
dependencies:
  engine: required
  ooc: required
  recorder: required
  player: required
condition:
  dependency_exists: engine

  file: /home/darkstar/DSN-exp/character_cards/materials/exa/网易云__1step_2step_-_鎖那.txt
  summary: '深夜十一点，出租屋的窗紧闭着，耳机线缠在桌角。林夕刚从一场失败的面试回来，连外套都没脱，就瘫倒在转椅上。手机随机播放到一首日文歌——鎖那的《わからない》。她不熟悉这个歌手，但前奏的钢琴音符像雨滴一样，一滴一滴砸在她紧绷的神经上。


    “わからない わからないよ もっと遠く”——她听懂了，尽管日语只是半吊子水平。“我不知道，我不知道啊，更远的地方……”这句歌词像一根针，精准地刺进她下午面对面试官时那种茫然的缝隙里。她重复着那句“廃れない言葉
    信じてる”，相信不会褪色的话语——可她连什么是“不会褪色”都说不清。


    吸进去的冷空气，吐出来的叹息。她跟着歌词里的节奏，想象自己也在唱歌、跳舞、跌倒、眩晕、再站起来。那句“さりげなく飛び込む あなたの腕の中”让她喉头一紧——飞入谁的怀中？她身边没有那样一个人。而下一句“私じゃないのなんだか
    ちょっと辛いな”更是让她眼眶发酸：不是自己，有点痛苦。她太懂了，为了迎合场合、迎合期待，她每天都在扮演一个“不是自己”的角色，那种痛苦被轻描淡写成“ちょっと辛い”，反而更重。


    她摘下耳机，发现右眼角有一滴泪已经滑到了下巴。她没擦，而是把这首歌点了单曲循环，然后打开记事本，开始写一行字：“如果连自己都不认识自己，那‘更远的地方’又有什么意义？”


    那一晚，她第一次觉得，也许迷茫本身就是一种答案。'

  file: /home/darkstar/DSN-exp/character_cards/materials/exa/网易云__ベイビーヘイロー_-_鎖那.txt
  summary: '地铁最后一班车厢的尽头，程洛靠在两节车厢的连接处，耳机线缠在包的背带上。她刚结束一场四个小时的跨部门会议，争论、妥协、再争论，像把同一块面团反复揉捏到失去弹性。她疲惫到连Home键都不想按，任由播放列表自动滑到一首没听过的歌。


    前奏响起时，她正盯着车窗上自己模糊的倒影。窗外隧道里的灯一盏一盏划过去，像某种徒劳的计数。


    “もしもなんて、ないのにどうして”——没有如果，可为什么还在想？她一愣。这句话直接撞上她今天下午在会议室里反复咀嚼的那个念头：如果当时没接这个项目就好了。她明明知道“如果”不存在，却还是把那个假设翻来覆去地嚼了一下午，嚼到脸颊发僵，像歌词里那句“つねった
    頬つめたいの”。


    她闭上眼睛。那句“気づかないふりすれば楽だから”让她下意识地咬住了下唇。是啊，假装没发现，假装不在乎，假装累只是一种普通的累——那多轻松。可她偏偏做不到。她每天睡前都像歌词里写的那样，“そっと目を覆ってさ毎晩のこと”，用手背盖住眼睛，在黑里等着睡意把自己吞掉。


    听到“間違いをただ 間違いだって 誰かに言ってほしかった?”时，她的睫毛颤了一下。她忽然意识到，自己想听的并不是有人告诉她“那不是你的错”——而是有人对她说：“对，那是错的，但那也没关系。”这两者之间那条细微的、几乎不被察觉的界限，她这一刻才真正分清楚。


    她睁开眼，把自己戴了很久的耳机摘下来一只，听见了地铁行驶的真实噪音。然后她做出了一个自己都不会有太多期待的决定：明天上午给那个总训她的主管发一条消息，问他愿不愿意单独聊聊。


    她不会道歉，也不会解释。她只想问一个问题：“我做得不对的地方，你能具体指给我看吗？”


    这算不上勇敢。但至少，她没有再假装自己不在乎。'

  file: /home/darkstar/DSN-exp/character_cards/materials/exa/网易云__tutu_-_鎖那.txt
  summary: '录音棚的灯还亮着，角落里堆着喝空的咖啡罐。沈屿之摘下监听耳机，揉了揉发烫的耳廓。晚上十一点，整栋楼只剩他一个人。今天第三次录同一首副歌，还是不对——那句“きらきらに手を伸ばして”，他唱得太干净了，像被漂白过的云，没有一丝皱褶。可原曲里那种唱到一半气息不稳的颤抖，那种在光芒中磕绊的脆弱，他始终抓不住。


    他滑开手机，点进N站，打算看看原唱鎖那的live版本找找感觉。搜索结果跳出来时，他随手点进一个播放量不高的视频——不是正片，是某场live的排练花絮。画面里鎖那穿着松垮的卫衣，披着半干的头发，在空舞台上光着脚反复练一段动作。她踩上白线，又掉下来，像歌词里那只磨损的偶人。然后她停下来，对着空气说了句话，字幕没翻，但他读懂了唇形：“瑕疵是不会消失的，但会变成钻石。”


    沈屿之把进度条往回拖，反复看了三遍那段花絮。他忽然想起高中画室那个总是画坏手部结构的女生，她说：“我把错误的地方勾了边，它反而不像错误了。”


    他坐回麦克风前，没再看谱。关掉所有效果器，只留一支电容麦，唱到“嫌いだった汚点は消えないまま”那句时，他故意没压住某个沙哑的尾音，让它赤裸地暴露在录音轨里。瑕疵留下来了。但这一次，他没有重录。他在监听里听见的不是完美，是一双从荆棘里伸出来的、伤痕累累却攥紧了玫瑰的手。


    凌晨一点，他导出分轨，在文件名后面加了个备注：“vocal_take_original”。然后关了灯，在黑暗里坐了很久。'

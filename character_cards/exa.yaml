  summary: '九月的风已经有些凉了，但池水还残留着夏末的温热。陆辞坐在泳池边的折叠椅上，脚边放着一瓶早就没了气泡的便利店碳酸水。他刚从那份做了三年的设计岗离职，离职理由填的是“个人发展”，但只有他自己知道，他只是不想再在那些永远改不完的方案里，把自己磨成一颗没有棱角的鹅卵石。


    泳池早已过了开放时间，水面安静得像一块嵌在地面上的蓝色玻璃。他戴上耳机，随手点开一首推送的歌，前奏是一个很轻的钢琴音，像有人在水面上弹了一颗石子。


    “なまぬるい波を立たせては フェンス越し君の影を”——微温的波浪涌起又落下，铁丝网那边是你的影子。他听着，目光漫无目的地扫过泳池另一端那道生锈的铁丝网。他想起大学时暗恋过的那个同学，他们曾在深夜的游泳池边聊过一次天，对方说“你总是把自己的想法藏得太深”，他当时不知道怎么接话，就只是笑了笑。


    歌继续唱：“ほんの少しでいいから 私は甘い炭酸で / 君がみせなかった表情の理由を / 知ることができるのなら”——如果能用一点点微甜的碳酸水，换来你从未显露过的那种表情的理由。他低头看了看桌上那瓶早已失掉气泡的饮料，忽然觉得这个比喻精准得像一根针。他想要的东西从来就不多，只比别人多那么一点点：一点袒露，一点真实，一点藏在平静表面之下的情绪。


    唱到“それでもあの連星のように / きえないで光り続けていたいから”时，他抬头看了看夜空。城市的光太亮，一颗星星也看不见。但他知道他想要的不是答案，甚至不是那个人——他只是不想再像一片落叶一样，让自己被风吹到哪儿就停在哪。


    他站起身，把那瓶没气的碳酸水丢进垃圾桶。然后在锁好的泳池大门前站了一会儿，在手机备忘录里写下一行字：


    “明天去买瓶新的。”'
